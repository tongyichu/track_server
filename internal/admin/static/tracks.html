<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>时光轨迹 - 控制台</title>
  <link rel="stylesheet" href="/admin/static/vendor/tabler.min.css" />
  <link rel="stylesheet" href="/admin/static/style.css" />
  <link rel="stylesheet" href="/admin/static/track_editor.css" />
</head>
<body>
  <header class="topbar">
    <div class="title">Track 管理后台</div>
    <nav class="nav">
      <a href="/admin/index.html">发布管理</a>
      <a href="/admin/users.html">用户管理</a>
      <a class="active" href="/admin/tracks.html">轨迹管理</a>
      <a href="/admin/track_submissions.html">投稿审核</a>
      <a href="/admin/route_groups.html">地图模式</a>
      <a href="/admin/companions.html">与友同行</a>
      <a href="/admin/feedbacks.html">意见反馈</a>
      <a href="/admin/analytics.html">埋点同步</a>
    </nav>
    <div class="spacer"></div>
    <div class="user">
      <span id="userName"></span>
      <button id="logoutBtn">退出</button>
    </div>
  </header>

  <main class="container wide">
    <div class="track-stat-grid">
      <section class="panel track-stat-card admin-stat-panel" data-track-stat="types" aria-labelledby="trackTypeStatsTitle">
        <div class="track-stat-heading">
          <h3 id="trackTypeStatsTitle">轨迹类型</h3>
          <div class="period-tabs" role="group" aria-label="轨迹类型统计周期">
            <button type="button" data-stat-period="day" aria-pressed="false">天</button>
            <button type="button" data-stat-period="week" aria-pressed="false">周</button>
            <button type="button" data-stat-period="month" class="active" aria-pressed="true">月</button>
          </div>
          <button type="button" class="btn btn-sm btn-outline-secondary" data-stat-refresh>刷新</button>
        </div>
        <p class="hint track-stat-status" data-stat-status role="status">加载中…</p>
        <div class="error" data-stat-error role="alert" hidden></div>
        <div class="admin-user-chart-layout track-type-chart-layout">
          <div id="trackTypeChart" class="track-stat-chart admin-user-pie" role="img" aria-label="轨迹类型分布环形图"></div>
          <div id="trackTypeLegend" class="admin-user-legend"></div>
        </div>
      </section>
      <section class="panel track-stat-card admin-stat-panel" data-track-stat="contributors" aria-labelledby="trackContributorStatsTitle">
        <div class="track-stat-heading">
          <h3 id="trackContributorStatsTitle">用户贡献轨迹量 Top 10</h3>
          <div class="period-tabs" role="group" aria-label="用户贡献轨迹量统计周期">
            <button type="button" data-stat-period="day" aria-pressed="false">天</button>
            <button type="button" data-stat-period="week" aria-pressed="false">周</button>
            <button type="button" data-stat-period="month" class="active" aria-pressed="true">月</button>
          </div>
          <button type="button" class="btn btn-sm btn-outline-secondary" data-stat-refresh>刷新</button>
        </div>
        <p class="hint track-stat-status" data-stat-status role="status">加载中…</p>
        <div class="error" data-stat-error role="alert" hidden></div>
        <div id="trackContributorChart" class="track-stat-chart" role="img" aria-label="前十用户贡献轨迹量横向柱状图"></div>
      </section>
    </div>
    <section id="trackImportPanel" class="track-import-panel" data-admin-write="tracks" aria-labelledby="trackImportTitle">
      <div class="track-import-heading">
        <div><h2 id="trackImportTitle">批量导入轨迹</h2><div class="hint">支持 JSON / GeoJSON / KML / KMZ，每批最多 50 个文件，预览图可在导入后补齐。</div></div>
      </div>
      <div id="trackImportError" class="error" role="alert" hidden></div>
      <div class="track-import-form">
        <div class="track-import-field">
          <span class="track-import-label">归属人（内部人员）</span>
          <div class="track-import-owner" id="trackImportOwner">
            <button type="button" class="btn btn-outline-secondary track-import-owner-toggle" id="trackImportOwnerToggle" aria-haspopup="listbox" aria-expanded="false">
              <span class="track-import-owner-current" id="trackImportOwnerCurrent">请选择归属人</span>
            </button>
            <ul class="companion-type-menu track-import-owner-menu" id="trackImportOwnerMenu" role="listbox" aria-label="选择归属人" hidden></ul>
          </div>
        </div>
        <label class="track-import-field">运动类型
          <select id="trackImportType" class="form-select">
            <option value="hiking">徒步</option><option value="running">跑步</option><option value="climbing">爬山</option><option value="riding">骑行</option><option value="driving">自驾</option>
          </select>
        </label>
        <label class="track-import-field">坐标系
          <select id="trackImportCoord" class="form-select">
            <option value="WGS84">WGS84（GPS 原始 / 国际设备）</option><option value="GCJ02">GCJ02（高德 / 国内 App）</option><option value="BD09">BD09（百度）</option>
          </select>
        </label>
        <div class="track-import-field track-import-files">
          <span class="track-import-label">轨迹文件</span>
          <input id="trackImportFiles" class="form-control" type="file" multiple accept=".json,.geojson,.kml,.kmz" />
          <span class="hint" id="trackImportFileHint">未选择文件</span>
        </div>
        <div><button id="trackImportSubmit" type="button" class="btn btn-primary" disabled>开始导入</button></div>
      </div>
      <div id="trackImportResults" class="track-import-results" hidden></div>
    </section>
    <section class="panel">
      <h2>轨迹列表 <span class="hint" id="totalHint"></span></h2>
      <div class="admin-toolbar track-toolbar">
        <label>标题搜索 <input id="titleFilter" class="form-control" type="search" placeholder="输入轨迹标题关键词" /></label>
        <label>用户名搜索 <input id="userNameFilter" class="form-control" type="search" placeholder="输入用户名关键词" /></label>
        <label>运动类型 <select id="trackTypeFilter" class="form-select" disabled><option value="">全部运动类型</option></select></label>
        <label>省份 <select id="provinceFilter" class="form-select"><option value="">全部省份</option></select></label>
        <label>城市 <select id="cityFilter" class="form-select"><option value="">全部城市</option></select></label>
        <label>状态 <select id="statusFilter" class="form-select"><option value="">全部状态</option><option value="1">公开</option><option value="2">私密</option><option value="0">已下架</option></select></label>
        <label>资料缺项 <select id="missingFilter" class="form-select"><option value="">全部</option><option value="place_candidate">待确认景点</option><option value="scenic_spot">未关联景点</option><option value="description">缺简介</option><option value="city">缺城市</option><option value="previews">缺预览图</option></select></label>
        <button id="searchBtn" class="btn btn-primary">搜索</button>
        <button id="refreshBtn" class="btn btn-outline-secondary">刷新</button>
        <button id="prevBtn" class="btn btn-outline-secondary" disabled>上一页</button>
        <button id="nextBtn" class="btn btn-outline-secondary" disabled>下一页</button>
        <span class="hint" id="pageHint"></span>
      </div>
      <p id="missingHint" class="hint" hidden></p>
      <p id="missingCountsError" class="text-secondary" role="status" hidden>部分缺项数量暂不可用，请刷新重试。</p>
      <p id="trackListError" class="text-danger" role="status" hidden></p>
      <div class="table-responsive">
      <table class="data table">
        <thead>
          <tr>
            <th>ID</th><th>城市</th><th>标题</th><th>类型</th><th>用户名</th><th>轨迹图</th><th>状态</th><th>操作</th>
          </tr>
        </thead>
        <tbody id="trackList"></tbody>
      </table>
      </div>
    </section>
  </main>

  <script src="/admin/static/vendor/tabler.min.js"></script>
  <script src="/admin/static/shell.js"></script>
  <script src="/admin/static/ui.js"></script>
  <script src="/admin/static/place_candidates.js"></script>
  <script src="/admin/static/track_map_preview.js"></script>
  <script src="/admin/static/track_editor.js"></script>
<script src="/admin/static/region_picker.js"></script>
  <script src="/admin/static/tracks.js"></script>
  <script src="/admin/static/admin_chart_style.js"></script>
  <script src="/admin/static/track_statistics.js"></script>
</body>
</html>
