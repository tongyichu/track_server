<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>轨迹管理 - Track</title>
  <link rel="stylesheet" href="/admin/static/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="title">Track 管理后台</div>
    <nav class="nav">
      <a href="/admin/index.html">App 发布</a>
      <a href="/admin/users.html">用户管理</a>
      <a class="active" href="/admin/tracks.html">轨迹管理</a>
      <a href="/admin/route_groups.html">聚合路线</a>
      <a href="/admin/companions.html">同行管理</a>
      <a href="/admin/feedbacks.html">意见反馈</a>
      <a href="/admin/analytics.html">埋点同步</a>
    </nav>
    <div class="spacer"></div>
    <div class="user">
      <span id="userName"></span>
      <button id="logoutBtn">退出</button>
    </div>
  </header>

  <main class="container wide">
    <section class="panel">
      <h2>轨迹列表 <span class="hint" id="totalHint"></span></h2>
      <div class="row">
        <button id="refreshBtn">刷新</button>
        <button id="prevBtn" disabled>上一页</button>
        <button id="nextBtn" disabled>下一页</button>
        <span class="hint" id="pageHint"></span>
      </div>
      <table class="data">
        <thead>
          <tr>
            <th>截图</th><th>ID</th><th>用户ID</th><th>标题</th><th>类型</th>
            <th>城市</th><th>距离(m)</th><th>时长(s)</th>
            <th>状态</th><th>开始时间</th><th>结束时间</th><th>操作</th>
          </tr>
        </thead>
        <tbody id="trackList"></tbody>
      </table>
    </section>
  </main>

  <script src="/admin/static/tracks.js"></script>
</body>
</html>
