<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>意见反馈 - Track</title>
  <link rel="stylesheet" href="/admin/static/vendor/tabler.min.css" />
  <link rel="stylesheet" href="/admin/static/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="title">Track 管理后台</div>
    <nav class="nav">
      <a href="/admin/index.html">App 发布</a>
      <a href="/admin/users.html">用户管理</a>
      <a href="/admin/tracks.html">轨迹管理</a>
      <a href="/admin/route_groups.html">聚合路线</a>
      <a href="/admin/companions.html">同行管理</a>
      <a class="active" href="/admin/feedbacks.html">意见反馈</a>
      <a href="/admin/analytics.html">埋点同步</a>
    </nav>
    <div class="spacer"></div>
    <div class="user">
      <span id="userName"></span>
      <button id="logoutBtn">退出</button>
    </div>
  </header>

  <main class="container">
    <div class="feedback-stat-sections">
      <section class="feedback-stat-section">
        <div class="feedback-stat-heading"><h2>处理状态</h2><span>当前反馈总量分布</span></div>
        <div class="feedback-stat-grid feedback-status-grid">
          <article class="panel feedback-stat"><span>待处理</span><strong id="statPending">—</strong></article>
          <article class="panel feedback-stat"><span>处理中</span><strong id="statProcessing">—</strong></article>
          <article class="panel feedback-stat"><span>已解决</span><strong id="statResolved">—</strong></article>
          <article class="panel feedback-stat"><span>已忽略</span><strong id="statIgnored">—</strong></article>
        </div>
      </section>
      <section class="feedback-stat-section">
        <div class="feedback-stat-heading"><h2>待处理时效</h2><span>用于关注积压反馈</span></div>
        <div class="feedback-stat-grid feedback-aging-grid">
          <article class="panel feedback-stat feedback-stat-warning"><span>待处理超 24 小时</span><strong id="statOver24">—</strong></article>
          <article class="panel feedback-stat feedback-stat-danger"><span>待处理超 72 小时</span><strong id="statOver72">—</strong></article>
        </div>
      </section>
    </div>
    <section class="panel">
      <h2>意见反馈列表</h2>
      <div class="row">
        <label>状态
          <select id="statusFilter">
            <option value="">全部</option>
            <option value="pending" selected>待处理</option>
            <option value="processing">处理中</option>
            <option value="resolved">已解决</option>
            <option value="ignored">已忽略</option>
          </select>
        </label>
        <label>版本
          <input id="versionFilter" type="text" placeholder="如 1.2.0" />
        </label>
        <label>手机号
          <input id="phoneFilter" type="text" placeholder="用户手机号" />
        </label>
        <button id="refreshBtn">刷新</button>
        <button id="prevBtn" disabled>上一页</button>
        <button id="nextBtn" disabled>下一页</button>
        <span class="hint" id="pageHint"></span>
      </div>
      <table class="data">
        <thead>
          <tr>
            <th>用户名称</th><th>状态</th><th>反馈内容</th>
            <th>图片</th><th>平台</th><th>版本</th><th>时间</th><th>操作</th>
          </tr>
        </thead>
        <tbody id="feedbackList"></tbody>
      </table>
    </section>

    <div class="modal modal-blur fade" id="detailModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-lg" role="document">
        <div class="modal-content">
          <div class="modal-header">
            <h2 class="modal-title">反馈详情</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
          </div>
          <div class="modal-body">
            <div id="emptyDetail" class="hint">请选择一条反馈查看详情</div>
            <div id="detailContent" class="hidden">
              <div class="detail-grid">
                <div><strong>用户名称</strong><span id="detailUserName"></span></div>
                <div><strong>状态</strong><span id="detailStatus"></span></div>
                <div><strong>客户端</strong><span id="detailClient"></span></div>
                <div><strong>设备</strong><span id="detailDevice"></span></div>
                <div><strong>联系方式</strong><span id="detailContact"></span></div>
                <div><strong>创建时间</strong><span id="detailCreated"></span></div>
                <div><strong>更新时间</strong><span id="detailUpdated"></span></div>
              </div>
              <div class="detail-block">
                <strong>反馈内容</strong>
                <p id="detailText"></p>
              </div>
              <div class="detail-block">
                <strong>图片</strong>
                <div id="detailImages" class="thumbs"></div>
              </div>
              <form id="statusForm" class="grid compact-grid">
                <label>处理状态
                  <select name="status" id="statusSelect">
                    <option value="pending">pending</option>
                    <option value="processing">processing</option>
                    <option value="resolved">resolved</option>
                    <option value="ignored">ignored</option>
                  </select>
                </label>
                <label class="full">反馈意见
                  <textarea name="reply" id="replyInput" rows="4" placeholder="resolved 状态必填，用户可见"></textarea>
                </label>
                <div class="full actions">
                  <button type="submit">保存处理结果</button>
                  <span class="error" id="saveErr"></span>
                  <span class="ok" id="saveOk"></span>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="/admin/static/vendor/tabler.min.js"></script>
  <script src="/admin/static/shell.js"></script>
  <script src="/admin/static/ui.js"></script>
  <script src="/admin/static/feedbacks.js"></script>
</body>
</html>
