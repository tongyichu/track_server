<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="no-referrer" />
  <title>时光轨迹 - 控制台</title>
  <link rel="stylesheet" href="/admin/static/vendor/tabler.min.css" />
  <link rel="stylesheet" href="/admin/static/style.css" />
</head>
<body>
  <main class="login-box admin-recovery-box">
    <h1>找回后台密码</h1>
    <p class="hint">验证事先绑定的邮箱后，由你重新设置密码。邮件不会包含登录密码。</p>
    <p id="recoveryAvailability" class="hint" role="status">正在检查邮件服务…</p>
    <p id="recoveryError" class="error" role="alert" hidden></p>
    <p id="recoveryMessage" class="ok" role="status" hidden></p>
    <form id="recoveryRequestForm">
      <label>后台登录名<input name="username" type="text" required maxlength="64" pattern="[A-Za-z0-9][A-Za-z0-9_.@\-]{0,63}" autocomplete="username" /></label>
      <label>已绑定并验证的邮箱<input name="email" type="email" required maxlength="254" autocomplete="email" /></label>
      <button id="requestRecoveryCode" type="submit" class="btn btn-primary" disabled>发送找回验证码</button>
      <button id="changeRecoveryIdentity" type="button" class="btn btn-outline-secondary mt-2" hidden>修改账号或邮箱</button>
    </form>
    <form id="recoveryCompleteForm" class="mt-4" hidden>
      <p id="recoveryTarget" class="hint"></p>
      <label>邮件验证码<input name="code" type="text" inputmode="numeric" pattern="[0-9]{8}" required maxlength="8" autocomplete="one-time-code" /></label>
      <label>新密码<input name="password" type="password" required minlength="8" maxlength="72" autocomplete="new-password" /></label>
      <label>确认新密码<input name="confirmation" type="password" required minlength="8" maxlength="72" autocomplete="new-password" /></label>
      <button id="completeRecovery" type="submit" class="btn btn-primary" disabled>设置新密码</button>
    </form>
    <a class="admin-auth-link" href="/admin/login.html">返回登录</a>
  </main>
  <script src="/admin/static/vendor/tabler.min.js"></script>
  <script src="/admin/static/ui.js"></script>
  <script src="/admin/static/forgot_password.js"></script>
</body>
</html>
