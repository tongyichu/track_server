<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>时光轨迹 - 控制台</title>
  <link rel="stylesheet" href="/admin/static/vendor/tabler.min.css" />
  <link rel="stylesheet" href="/admin/static/style.css" />
  <link rel="stylesheet" href="/admin/static/admin_stats.css" />
</head>
<body>
  <header class="topbar"></header>
  <main class="container wide dashboard-page">
    <div class="page-heading dashboard-heading">
      <div><h1>运营工作台</h1><p class="admin-stats-meta" id="rangeHint"></p></div>
      <div class="dashboard-heading-actions">
        <div class="period-tabs admin-period-tabs" role="group" aria-label="统计周期">
          <button data-period="day" class="active">日</button>
          <button data-period="week">周</button>
          <button data-period="month">月</button>
        </div>
        <button id="refreshDashboard" class="quiet-button">刷新数据</button>
      </div>
    </div>

    <div id="dashboardError" class="notice error hidden"></div>

    <section class="admin-metrics" aria-live="polite">
      <article data-admin-read="users" class="admin-metric" data-admin-metric="" data-label="活跃用户" data-value-id="activeUsers" data-note="正在加载" data-note-id="activeUsersDelta"></article>
      <article data-admin-read="users" class="admin-metric" data-admin-metric="" data-label="新增用户" data-value-id="newUsers" data-note="正在加载" data-note-id="newUsersDelta"></article>
      <article data-admin-read="tracks" class="admin-metric" data-admin-metric="" data-label="新增轨迹" data-value-id="uploadedTracks" data-note="正在加载" data-note-id="uploadedTracksDelta"></article>
      <article data-admin-read="tracks" class="admin-metric" data-admin-metric="" data-label="上传用户" data-value-id="uploadUsers" data-note="正在加载" data-note-id="uploadUsersDelta"></article>
      <article data-admin-read="track_submissions" class="admin-metric" data-admin-metric="" data-label="新增投稿" data-value-id="submissions" data-note="正在加载" data-note-id="submissionsDelta"></article>
    </section>

    <section class="dashboard-section">
      <div class="section-heading"><div><h2>增长与转化</h2></div></div>
      <div class="dashboard-layout dashboard-layout-main">
        <article class="panel dashboard-card dashboard-card-wide" data-admin-read="users tracks">
          <div class="dashboard-card-header"><div><h3>用户与轨迹趋势</h3></div></div>
          <div class="dashboard-card-body"><div id="trendChart" class="dashboard-chart chart-large" role="img" aria-label="用户和轨迹趋势图"></div></div>
        </article>
        <article class="panel dashboard-card" data-admin-read="users tracks track_submissions">
          <div class="dashboard-card-header"><div><h3>新增用户转化</h3></div></div>
          <div class="dashboard-card-body"><div id="funnelChart" class="dashboard-chart chart-large" role="img" aria-label="本周期注册用户的上传、投稿及审核转化"></div></div>
        </article>
      </div>
    </section>

    <section class="dashboard-section">
      <div class="section-heading"><div><h2>运营效率</h2></div></div>
      <div class="dashboard-layout dashboard-layout-equal">
        <article class="panel dashboard-card" data-admin-read="track_submissions">
          <div class="dashboard-card-header"><div><h3>投稿审核</h3></div><a href="/admin/track_submissions.html?status=pending">进入审核</a></div>
          <div class="dashboard-card-body">
            <div class="stat-list stat-list-four">
              <div class="admin-metric admin-metric-inline" data-admin-metric="" data-label="待审核" data-value-id="reviewPending"></div>
              <div class="admin-metric admin-metric-inline" data-admin-metric="" data-label="超 24 小时" data-value-id="reviewOver24" data-tone="warning"></div>
              <div class="admin-metric admin-metric-inline" data-admin-metric="" data-label="超 72 小时" data-value-id="reviewOver72" data-tone="danger"></div>
              <div class="admin-metric admin-metric-inline" data-admin-metric="" data-label="通过率" data-value-id="approvalRate"></div>
            </div>
            <div class="dashboard-detail-row"><span>平均审核耗时</span><strong id="avgReviewHours">--</strong></div>
            <div class="dashboard-detail-row"><span>最早待审核</span><strong id="oldestPending">--</strong></div>
            <details id="reviewBreakdown" class="admin-stat-disclosure"><summary>审核结果分布</summary><div class="dashboard-ring"><div id="reviewChart" class="dashboard-chart chart-small" role="img" aria-label="审核结果分布"></div><div id="reviewChartLegend" class="admin-user-legend"></div></div></details>
          </div>
        </article>

        <article class="panel dashboard-card" data-admin-read="feedbacks">
          <div class="dashboard-card-header"><div><h3>意见反馈</h3></div><a href="/admin/feedbacks.html">处理反馈</a></div>
          <div class="dashboard-card-body">
            <div class="stat-list stat-list-four">
              <div class="admin-metric admin-metric-inline" data-admin-metric="" data-label="待处理" data-value-id="feedbackPending"></div>
              <div class="admin-metric admin-metric-inline" data-admin-metric="" data-label="处理中" data-value-id="feedbackProcessing"></div>
              <div class="admin-metric admin-metric-inline" data-admin-metric="" data-label="超 24 小时" data-value-id="feedbackOver24" data-tone="warning"></div>
              <div class="admin-metric admin-metric-inline" data-admin-metric="" data-label="超 72 小时" data-value-id="feedbackOver72" data-tone="danger"></div>
            </div>
            <div class="dashboard-detail-row"><span>本周期已解决</span><strong id="feedbackResolvedPeriod">--</strong></div>
            <div class="dashboard-detail-row"><span>平均解决耗时</span><strong id="avgResolutionHours">--</strong></div>
            <details id="feedbackBreakdown" class="admin-stat-disclosure"><summary>状态与来源分布</summary><div class="split-charts"><div class="dashboard-ring"><div id="feedbackStatusChart" class="dashboard-chart chart-small" role="img" aria-label="反馈状态分布"></div><div id="feedbackStatusChartLegend" class="admin-user-legend"></div></div><div id="feedbackVersionChart" class="dashboard-chart chart-small" role="img" aria-label="反馈来源分布"></div></div></details>
          </div>
        </article>
      </div>
    </section>

    <section class="dashboard-section" data-admin-read="tracks">
      <div class="section-heading"><div><h2>内容供给与质量</h2></div><a class="section-link" href="/admin/tracks.html">管理轨迹</a></div>
      <div class="quality-strip admin-metrics">
        <article class="admin-metric" data-admin-metric="" data-label="平均距离" data-value-id="avgDistance"></article>
        <article class="admin-metric" data-admin-metric="" data-label="平均时长" data-value-id="avgDuration"></article>
        <article class="admin-metric" data-admin-metric="" data-label="长时间运行中" data-value-id="staleRunning" data-tone="warning"></article>
        <article class="admin-metric" data-admin-metric="" data-label="零距离轨迹" data-value-id="zeroDistance" data-tone="warning"></article>
        <article class="admin-metric" data-admin-metric="" data-label="索引失败" data-value-id="failedMapJobs" data-admin-read="route_groups" data-tone="danger"></article>
        <article class="admin-metric" data-admin-metric="" data-label="待建索引" data-value-id="pendingMapJobs" data-admin-read="route_groups"></article>
        <article class="admin-metric" data-admin-metric="" data-label="有效路线组" data-value-id="activeRouteGroups" data-admin-read="route_groups"></article>
      </div>
      <div class="dashboard-layout dashboard-layout-thirds">
        <article class="panel dashboard-card"><div class="dashboard-card-header"><div><h3>公开状态</h3></div></div><div class="dashboard-card-body"><div class="dashboard-ring"><div id="trackStatusChart" class="dashboard-chart chart-medium" role="img" aria-label="轨迹公开状态"></div><div id="trackStatusChartLegend" class="admin-user-legend"></div></div></div></article>
        <article class="panel dashboard-card"><div class="dashboard-card-header"><div><h3>运动类型</h3></div></div><div class="dashboard-card-body"><div class="dashboard-ring"><div id="trackTypeChart" class="dashboard-chart chart-medium" role="img" aria-label="运动类型"></div><div id="trackTypeChartLegend" class="admin-user-legend"></div></div></div></article>
        <article class="panel dashboard-card"><div class="dashboard-card-header"><div><h3>热门城市</h3></div></div><div class="dashboard-card-body"><div id="trackCityChart" class="dashboard-chart chart-medium"></div></div></article>
      </div>
    </section>

    <section class="dashboard-section">
      <div class="section-heading"><div><h2>互动与同行</h2></div></div>
      <div class="dashboard-layout dashboard-layout-main">
        <article class="panel dashboard-card dashboard-card-wide" data-admin-read="tracks">
          <div class="dashboard-card-header"><div><h3>内容互动趋势</h3></div></div>
          <div class="dashboard-card-body">
            <div class="stat-list stat-list-four engagement-summary">
              <div class="admin-metric admin-metric-inline" data-admin-metric="" data-label="收藏" data-value-id="engagementCollections" data-note="" data-note-id="engagementCollectionsDelta"></div>
              <div class="admin-metric admin-metric-inline" data-admin-metric="" data-label="导航" data-value-id="engagementNavigations" data-note="" data-note-id="engagementNavigationsDelta"></div>
              <div class="admin-metric admin-metric-inline" data-admin-metric="" data-label="点赞" data-value-id="engagementLikes" data-note="" data-note-id="engagementLikesDelta"></div>
              <div class="admin-metric admin-metric-inline" data-admin-metric="" data-label="评论" data-value-id="engagementComments" data-note="" data-note-id="engagementCommentsDelta"></div>
            </div>
            <div id="engagementChart" class="dashboard-chart chart-large"></div>
          </div>
        </article>
        <article class="panel dashboard-card" data-admin-read="companions">
          <div class="dashboard-card-header"><div><h3>同行概览</h3></div><a href="/admin/companions.html">查看会话</a></div>
          <div class="dashboard-card-body companion-overview">
            <div class="companion-primary"><span>当前活跃</span><strong id="companionActive">--</strong><small>个同行会话</small></div>
            <div class="dashboard-detail-row"><span>本周期新增</span><strong id="companionCreated">--</strong></div>
            <div class="dashboard-detail-row"><span>本周期结束</span><strong id="companionEnded">--</strong></div>
            <div class="dashboard-detail-row"><span>自动结束</span><strong id="companionAutoEnded">--</strong></div>
            <div class="dashboard-detail-row"><span>平均参与人数</span><strong id="companionParticipants">--</strong></div>
          </div>
        </article>
      </div>

      <article class="panel dashboard-card top-tracks-card" data-admin-read="tracks">
        <div class="dashboard-card-header"><div><h3>热门轨迹</h3></div></div>
        <div class="dashboard-card-body dashboard-table-wrap">
          <table class="data dashboard-table">
            <thead><tr><th>轨迹</th><th>标题</th><th>收藏</th><th>导航</th><th>点赞</th><th>评论</th><th>总互动</th></tr></thead>
            <tbody id="topTracks"></tbody>
          </table>
        </div>
      </article>
    </section>

    <p class="dashboard-updated" id="updatedAt"></p>
  </main>
  <script src="/admin/static/vendor/tabler.min.js"></script>
  <script src="/admin/static/shell.js"></script>
  <script src="/admin/static/admin_stats.js"></script>
  <script src="/admin/static/ui.js"></script>
  <script src="/admin/static/admin_chart_style.js"></script>
  <script src="/admin/static/dashboard.js"></script>
</body>
</html>
