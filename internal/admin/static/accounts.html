<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>时光轨迹 - 控制台</title>
  <link rel="stylesheet" href="/admin/static/admin-components.css" />
  <link rel="stylesheet" href="/admin/static/style.css" />
</head>
<body>
  <header class="topbar"></header>
  <main class="container wide accounts-page">
    <div class="page-heading"><h1>账号管理</h1><div class="d-flex gap-2"><button id="refreshAccounts" class="btn btn-outline-secondary btn-touch">刷新账号</button><button id="createAccount" class="btn btn-primary">新增账号</button></div></div>
    <p id="accountsError" class="alert alert-danger" hidden role="alert"></p>
    <section class="panel p-0 accounts-list" aria-label="后台账号">
      <table class="table data"><thead><tr><th>账号</th><th>状态</th><th>找回邮箱</th><th>最近登录</th><th>操作</th></tr></thead>
        <tbody id="accountsList"><tr><td colspan="5" class="text-secondary text-center">正在加载账号…</td></tr></tbody>
      </table>
    </section>
    <p id="emailMigrationHint" class="small text-secondary accounts-migration" hidden><span id="emailMigrationText"></span> <a href="/admin/password.html" id="verifyOwnRecoveryEmail" hidden>前往账号安全</a></p>
    <section class="panel mt-3">
      <div class="admin-section-heading flex-wrap gap-2">
        <h2>最近操作记录</h2>
        <div class="d-flex flex-wrap align-items-center gap-2 accounts-audit-filters">
          <select id="auditAccountFilter" class="form-select form-select-sm w-auto" aria-label="操作人" disabled><option value="">全部操作人</option></select>
          <select id="auditOperationFilter" class="form-select form-select-sm w-auto" aria-label="操作类型">
            <option value="">全部操作类型</option><option value="account_create">新增账号</option><option value="account_update">更新账号</option><option value="account_reset">应急重置</option>
          </select>
          <button id="refreshAudit" class="btn btn-sm btn-outline-secondary">刷新记录</button>
        </div>
      </div>
      <p id="auditError" class="error" hidden role="alert"></p>
      <div class="table-responsive">
        <table class="table data admin-audit-table">
          <colgroup>
            <col class="admin-audit-col-time" />
            <col class="admin-audit-col-actor" />
            <col class="admin-audit-col-action" />
            <col class="admin-audit-col-target" />
            <col class="admin-audit-col-result" />
          </colgroup>
          <thead><tr><th>时间</th><th>操作人</th><th>操作</th><th>对象</th><th>结果</th></tr></thead>
          <tbody id="auditList" aria-live="polite"></tbody>
        </table>
      </div>
    </section>
  </main>
  <dialog class="modal admin-account-modal" id="accountModal" aria-labelledby="accountTitle" aria-hidden="true"><div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable"><form id="accountForm" class="modal-content" method="post">
    <div class="modal-header"><h2 id="accountTitle" class="modal-title">新增账号</h2><button type="button" class="btn-close" data-admin-dismiss="dialog" aria-label="关闭"></button></div>
    <div class="modal-body">
      <div class="account-form-fields">
        <label class="form-label"><span>登录名</span><input name="username" class="form-control" required maxlength="64" pattern="[A-Za-z0-9][A-Za-z0-9_.@\-]{0,63}" autocomplete="off" /><small class="form-hint" id="newUsernameHint">创建后不可修改</small></label>
        <label class="form-label"><span>显示名称</span><input name="display_name" class="form-control" maxlength="64" /></label>
        <label class="form-label"><span>身份</span><select name="role" class="form-select"><option value="operator">操作员</option><option value="admin">管理员</option></select></label>
        <label class="form-label"><span>状态</span><select name="enabled" class="form-select"><option value="true">启用</option><option value="false">停用</option></select></label>
        <label id="initialPasswordField" class="form-label account-initial-password"><span>临时密码</span><input name="password" type="password" class="form-control" autocomplete="new-password" /><small class="form-hint">至少 8 个字符，最多 72 字节。首次登录须修改</small></label>
      </div>
      <section class="mt-3" aria-labelledby="accountPermissionsHeading">
        <h3 id="accountPermissionsHeading">页面权限</h3>
        <p id="adminPermissionHint" class="small text-secondary mb-0" hidden>管理员可查看和操作所有页面，包括账号管理。</p>
        <div id="permissionMatrix">
          <p class="small text-secondary">可操作权限包含该页面的编辑、删除、审核或发布等操作。</p>
          <div id="permissionRows" class="account-permission-groups"></div>
        </div>
      </section>
    </div>
    <div class="modal-footer">
      <label class="form-check alert alert-warning account-modal-message" id="accountChangeConfirm" hidden>
        <input class="form-check-input" id="confirmAccountChange" type="checkbox" />
        <span class="form-check-label" id="accountChangeMessage"></span>
      </label>
      <p id="accountFormError" class="alert alert-danger account-modal-message" hidden role="alert"></p>
      <button type="button" class="btn btn-outline-secondary" data-admin-dismiss="dialog">取消</button>
      <button id="saveAccount" type="submit" class="btn btn-primary">保存</button>
    </div>
  </form></div></dialog>
  <dialog class="modal admin-account-modal" id="accountResetModal" aria-labelledby="accountResetTitle" aria-hidden="true"><div class="modal-dialog modal-dialog-centered"><form id="accountResetForm" class="modal-content" method="post">
    <div class="modal-header"><h2 id="accountResetTitle" class="modal-title">应急重置</h2><button type="button" class="btn-close" data-admin-dismiss="dialog" aria-label="关闭"></button></div>
    <div class="modal-body">
      <p class="small text-secondary">重置会退出该账号的所有登录。账号持有人下次登录时须修改临时密码。</p>
      <label class="form-label"><span>临时密码</span><input name="password" class="form-control" type="password" required autocomplete="new-password" /><small class="form-hint">至少 8 个字符，最多 72 字节</small></label>
      <p id="accountResetError" class="alert alert-danger mb-0" hidden role="alert"></p>
    </div>
    <div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-admin-dismiss="dialog">取消</button><button id="confirmAccountReset" type="submit" class="btn btn-danger">重置并退出登录</button></div>
  </form></div></dialog>
  <script src="/admin/static/admin-components.js"></script>
  <script src="/admin/static/shell.js"></script>
  <script src="/admin/static/ui.js"></script>
  <script src="/admin/static/audit_log.js"></script>
  <script src="/admin/static/accounts.js"></script>
</body>
</html>
