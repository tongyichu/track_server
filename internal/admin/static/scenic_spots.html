<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>景点管理 - Track</title>
  <link rel="stylesheet" href="/admin/static/vendor/tabler.min.css" />
  <link rel="stylesheet" href="/admin/static/style.css" />
  <style>
    .scenic-stats-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.scenic-stat{padding:16px;border:1px solid var(--tblr-border-color);border-radius:10px;background:var(--tblr-bg-surface)}.scenic-stat-label,.scenic-hint{color:var(--tblr-secondary-color);font-size:13px}.scenic-stat-value{font-size:25px;font-weight:650;margin-top:5px}.scenic-stat-note{font-size:12px;color:var(--tblr-secondary-color);margin-top:3px}.scenic-stats-lower{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(320px,1fr);gap:20px;margin-top:18px}.scenic-bars{height:100px;display:flex;align-items:end;gap:4px;padding:8px 4px 0;border-bottom:1px solid var(--tblr-border-color)}.scenic-bar-col{height:100%;flex:1;display:flex;align-items:end;min-width:4px}.scenic-bar{width:100%;min-height:2px;border-radius:3px 3px 0 0;background:var(--tblr-primary);opacity:.8}.scenic-bars-label{display:flex;justify-content:space-between;color:var(--tblr-secondary-color);font-size:11px;margin-top:5px}.scenic-top-list{display:grid;gap:8px}.scenic-top-item{display:grid;grid-template-columns:32px 1fr auto;gap:9px;align-items:center;padding:8px;border-bottom:1px solid var(--tblr-border-color);cursor:pointer}.scenic-top-item:hover{background:var(--tblr-bg-surface-secondary)}.scenic-medal{font-size:21px}.scenic-search{display:flex;gap:12px;align-items:end;flex-wrap:wrap}.scenic-catalog{display:grid;gap:0}.scenic-row{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:20px;align-items:center;padding:12px 14px;border-top:1px solid var(--tblr-border-color);cursor:pointer}.scenic-row:hover,.scenic-row.active{background:var(--tblr-bg-surface-secondary)}.scenic-row-main{min-width:0}.scenic-row-title{display:flex;align-items:center;gap:10px;font-weight:650}.scenic-row-sub{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:4px}.scenic-row-description{font-size:13px;color:var(--tblr-secondary-color);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.scenic-row-photos{display:flex;justify-content:flex-end;gap:6px}.scenic-row-photos img{width:64px;height:48px;object-fit:cover;border-radius:6px;background:var(--tblr-bg-surface-secondary)}.scenic-mode{font-size:12px;border-radius:20px;padding:2px 9px;background:var(--tblr-bg-surface-secondary);color:var(--tblr-secondary-color)}.scenic-mode.manual{background:#eaf2ff;color:#206bc4}.scenic-mode.automatic{background:#eaf7ef;color:#2b8a3e}.scenic-modal{width:min(960px,calc(100vw - 32px));max-height:calc(100vh - 32px);padding:0;border:0;border-radius:12px;box-shadow:0 20px 70px #18243340}.scenic-modal::backdrop{background:#18243380}.scenic-modal-body{padding:20px;overflow:auto;max-height:calc(100vh - 32px)}.scenic-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.scenic-fields label{display:grid;gap:6px}.scenic-fields .full{grid-column:1/-1}.scenic-provider-preview{border:1px solid var(--tblr-border-color);border-radius:10px;background:var(--tblr-bg-surface-secondary);padding:12px;margin:12px 0}.scenic-provider-photo-grid,.scenic-photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:10px}.scenic-provider-photo,.scenic-photo{border:1px solid var(--tblr-border-color);border-radius:8px;padding:7px;background:var(--tblr-bg-surface)}.scenic-provider-photo img,.scenic-photo img{width:100%;height:105px;object-fit:cover;border-radius:5px}.scenic-photo input{margin-top:6px}.scenic-city{display:flex;gap:8px;align-items:center}.scenic-detail-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.scenic-detail-head{display:flex;align-items:flex-start;gap:12px}.scenic-detail-head .spacer{flex:1}
    @media(max-width:900px){.scenic-stats-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.scenic-stats-lower{grid-template-columns:1fr}.scenic-row{grid-template-columns:minmax(0,1fr) 150px;gap:10px}.scenic-row-photos img{width:44px;height:38px}.scenic-fields{grid-template-columns:1fr}.scenic-fields .full{grid-column:auto}}
    @media(max-width:560px){.scenic-row{grid-template-columns:1fr}.scenic-row-photos{justify-content:flex-start}.scenic-stats-grid{gap:8px}.scenic-stat{padding:12px}}
    .scenic-photo{cursor:grab}.scenic-photo:active{cursor:grabbing}.scenic-photo.dragging{opacity:.45}.scenic-photo.drop-target{outline:2px solid var(--tblr-primary)}.scenic-photo-source{font-size:11px;color:var(--tblr-secondary-color);margin-top:3px}.scenic-provider-hint{font-size:12px;color:var(--tblr-secondary-color);font-weight:400}
  </style>
</head>
<body>
  <header class="topbar"></header>
  <main class="container wide">
    <section class="panel">
      <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-3"><div><h2 class="mb-1">运营统计</h2><div id="statsPeriod" class="scenic-hint"></div></div><button id="refreshStatsBtn" class="btn btn-sm btn-outline-secondary">刷新</button></div>
      <div class="scenic-stats-grid">
        <div class="scenic-stat"><div class="scenic-stat-label">自有景点</div><div id="statsPublished" class="scenic-stat-value">—</div><div id="statsPublishedNote" class="scenic-stat-note">已发布</div></div>
        <div class="scenic-stat"><div class="scenic-stat-label">已关联轨迹</div><div id="statsCoveredTracks" class="scenic-stat-value">—</div><div id="statsCoveredNote" class="scenic-stat-note">发布景点覆盖轨迹</div></div>
        <div class="scenic-stat"><div class="scenic-stat-label">今日地图查询</div><div id="statsTodayCalls" class="scenic-stat-value">—</div><div class="scenic-stat-note">已关联景点的详情与图片</div></div>
        <div class="scenic-stat"><div class="scenic-stat-label">近 30 日地图查询</div><div id="statsMonthCalls" class="scenic-stat-value">—</div><div id="statsMonthNote" class="scenic-stat-note">成功与失败请求</div></div>
      </div>
      <div class="scenic-stats-lower"><div><h3>近 30 日查询趋势</h3><div id="statsDailyBars" class="scenic-bars"></div><div id="statsDailyLabels" class="scenic-bars-label"></div></div><div><h3>高调用景点 · 近 30 日</h3><div id="statsTopSpots" class="scenic-top-list"><div class="scenic-hint">加载中</div></div></div></div>
      <div id="providerSyncProgress" class="scenic-hint mt-3" hidden></div>
    </section>
    <section class="panel">
      <div class="scenic-search">
        <label>名称搜索<input id="searchInput" class="form-control" type="search" placeholder="景点名称" /></label>
        <label>资料状态<select id="statusFilter" class="form-select"><option value="">全部</option><option value="automatic">自动</option><option value="manual">人工</option></select></label>
        <button id="searchBtn" class="btn btn-primary">查询</button><button id="newBtn" class="btn btn-outline-primary">新建景点</button>
      </div>
    </section>
    <section class="panel p-0">
      <div class="d-flex align-items-center justify-content-between p-3"><h2 class="mb-0">景点目录</h2><span id="spotCount" class="scenic-hint"></span></div>
      <div id="spotRows" class="scenic-catalog"><div class="p-3 scenic-hint">加载中</div></div>
    </section>
  </main>
  <dialog id="detailModal" class="scenic-modal"><div id="detailPanel" class="scenic-modal-body">
    <div class="scenic-detail-head"><div><h2 id="detailTitle" class="mb-1">景点资料</h2><div class="scenic-detail-actions"><span id="detailMode" class="scenic-mode"></span><span id="detailMeta" class="scenic-hint"></span></div></div><span class="spacer"></span><button id="closeDetailBtn" class="btn btn-outline-secondary">关闭</button></div>
    <div class="scenic-fields mt-3">
      <label>景点名称<input id="nameInput" class="form-control" maxlength="160" /><small id="providerNameHint" class="scenic-provider-hint"></small></label>
      <label>分类<input id="categoryInput" class="form-control" maxlength="100" /><small id="providerCategoryHint" class="scenic-provider-hint"></small></label>
      <label class="full">地址<input id="addressInput" class="form-control" maxlength="500" /><small id="providerAddressHint" class="scenic-provider-hint"></small></label>
      <label class="full">简介<textarea id="descriptionInput" class="form-control" rows="3" maxlength="8000"></textarea><small id="providerDescriptionHint" class="scenic-provider-hint"></small></label>
      <div id="cityInfo" class="scenic-city scenic-hint full"></div>
    </div>
    <section class="mt-3"><div class="d-flex align-items-center flex-wrap gap-2"><h3 class="mb-0">景点图片</h3><input id="photoFile" type="file" accept="image/jpeg,image/png" /><input id="photoCaption" class="form-control" style="max-width:220px" placeholder="图片说明" /><button id="uploadPhotoBtn" class="btn btn-outline-primary">添加图片</button></div><div class="scenic-hint mt-1">拖动图片调整顺序；新上传图片追加到末尾。保存后按此顺序下发。</div><div id="photosBox" class="scenic-photo-grid"></div></section>
    <div class="d-flex justify-content-end gap-2 mt-4"><button id="publishBtn" class="btn btn-outline-success">发布</button><button id="saveBtn" class="btn btn-primary">保存修改</button></div>
  </div></dialog>
  <script src="/admin/static/vendor/tabler.min.js"></script><script src="/admin/static/shell.js"></script><script src="/admin/static/ui.js"></script><script src="/admin/static/scenic_spots.js"></script>
</body>
</html>
