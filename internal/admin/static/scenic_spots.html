    .scenic-stats-lower { grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 16px; margin-top: 12px; }
    .scenic-chart-panel { min-width: 0; }
    .scenic-chart-heading { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; min-height: 34px; margin-bottom: 8px; }
    .scenic-chart-heading h3 { margin: 0; }
    .scenic-chart-stage { position: relative; }
    .scenic-spatial-chart, .scenic-trend-chart { width:100%; }
    .scenic-spatial-chart { height:256px; }
    .scenic-trend-chart { height:168px; }
    .scenic-chart-note { margin: 8px 0 0; font-size: 12px; }
    .scenic-chart-error { position: absolute; inset: 0; display: grid; place-items: center; margin: 0; padding: 20px; color: var(--admin-secondary-color); background: var(--admin-bg-surface); font-size: 13px; }
    .scenic-chart-error[hidden] { display: none; }
    .scenic-map-selection { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
    .scenic-map-selection[hidden] { display: none; }
    .scenic-map-selection select { flex: 1; min-width: 0; }
    .scenic-map-selection button { flex-shrink: 0; }
    .scenic-chart-heading [aria-pressed="true"] { background: var(--admin-primary); border-color: var(--admin-primary); color: #fff; }
    @media (max-width: 900px) { .scenic-stats-lower { grid-template-columns: 1fr; } }
    .scenic-chart-disclosure > summary { width:fit-content; cursor:pointer; color:var(--admin-secondary-color); }

    .scenic-catalog-link:hover { text-decoration:underline; }
    .scenic-catalog-link:focus-visible { outline:2px solid var(--admin-primary); outline-offset:2px; }
    .scenic-catalog .name-cell { font-weight:600; }
    .scenic-catalog th.scenic-number,.scenic-catalog td.scenic-number { text-align:end; font-variant-numeric:tabular-nums; }
    .scenic-mobile-label,.scenic-mobile-no-photos { display:none; }
    @media (max-width:900px) {
      .scenic-stats-panel .admin-metric { min-height:56px; padding:6px 10px; }
      .scenic-stats-panel .admin-metric-value { font-size:20px; }

      .scenic-catalog-main,.scenic-catalog-main tbody { display:block; min-width:0; }
      .scenic-catalog-main thead { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); }
      .scenic-catalog-main tr[data-spot-id] {
        display:grid; grid-template-columns:minmax(0,1fr) auto auto; align-items:center;
        gap:2px 8px; padding:9px 14px; border-top:1px solid var(--admin-border-color);
      }
      .scenic-catalog-main tr[data-spot-id] > td { min-width:0; padding:0; border:0; overflow-wrap:anywhere; }
      .scenic-catalog-main .name-cell { grid-area:1 / 1 / 2 / 3; }
      .scenic-catalog-main .scenic-grade { grid-area:1 / 3; text-align:end; }
      .scenic-catalog-main .city-cell { grid-area:2 / 1; }
      .scenic-catalog-main .scenic-mode { grid-area:2 / 2; }
      .scenic-catalog-main .scenic-tracks { grid-area:2 / 3; }

<body class="scenic-spots-page">
  <header class="topbar"></header>
  <main class="container wide">
    <section class="panel scenic-stats-panel admin-stats-panel">
      <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-3"><div><h2 class="mb-1">景点概况</h2><div id="statsUpdated" class="scenic-hint">当前有效景点目录</div></div><div class="d-flex gap-2 flex-wrap"><button id="syncProviderBtn" type="button" data-admin-write="scenic_spots" class="btn btn-sm btn-ghost-secondary">同步供应商资料</button><button id="refreshStatsBtn" type="button" class="btn btn-sm btn-outline-secondary">刷新数据</button></div></div>
      <div id="statsError" class="error mb-3" role="alert" hidden></div>
      <div class="admin-metrics">
        <div class="admin-metric" data-admin-metric="" data-label="有效景点" data-value-id="statsSpotTotal" data-note="排除已归档、已合并景点"></div>
        <div class="admin-metric" data-admin-metric="" data-label="覆盖城市" data-value-id="statsCityTotal" data-note="景点及有效关联轨迹所在城市去重"></div>
        <div class="admin-metric" data-admin-metric="" data-label="有效关联轨迹" data-value-id="statsLinkedTracks" data-note="已完成且有原始文件的非删除轨迹"></div>
        <button id="showIncompleteBtn" type="button" class="admin-metric" data-admin-metric="" data-label="待完善" data-value-id="statsIncomplete" data-note="查看缺项" data-note-id="statsIncompleteNote"></button>
      </div>
      <details id="scenicChartsDisclosure" class="scenic-chart-disclosure" open>
        <summary>分布与新增趋势</summary>
      <div class="scenic-stats-lower">
        <section class="scenic-chart-panel">
          <div class="scenic-chart-heading admin-stats-heading"><h3>景点空间分布</h3><button id="resetScenicMap" type="button" class="btn btn-sm btn-outline-secondary">全国视图</button></div>
          <div class="scenic-chart-stage"><div id="scenicSpatialChart" class="scenic-spatial-chart" role="img" aria-label="景点空间分布地图，可缩放和拖动，聚合数字表示景点数量"></div><p id="scenicSpatialError" class="scenic-chart-error" role="status" hidden></p></div>
          <p id="scenicSpatialSummary" class="scenic-hint scenic-chart-note" role="status">正在加载地图…</p>
          <div id="scenicMapSelection" class="scenic-map-selection" hidden><label for="scenicMapSpot" class="visually-hidden">选择景点</label><select id="scenicMapSpot" class="form-select form-select-sm"></select><button id="openScenicMapSpot" type="button" class="btn btn-sm btn-outline-primary">查看详情</button></div>
        </section>
        <section class="scenic-chart-panel">
          <div class="scenic-chart-heading admin-stats-heading"><h3>新增景点趋势</h3><div class="btn-group btn-group-sm admin-period-tabs" role="group" aria-label="新增景点统计周期"><button type="button" class="btn btn-outline-secondary" data-scenic-days="1" aria-pressed="false">近 1 天</button><button type="button" class="btn btn-outline-secondary" data-scenic-days="7" aria-pressed="false">近 7 天</button><button type="button" class="btn btn-outline-secondary active" data-scenic-days="30" aria-pressed="true">近 30 天</button></div></div>
          <p id="scenicTrendSummary" class="scenic-hint scenic-chart-note" role="status">正在加载趋势…</p>
          <div class="scenic-chart-stage"><div id="scenicTrendChart" class="scenic-trend-chart" role="img" aria-label="新增入库景点数量趋势图"></div><p id="scenicTrendError" class="scenic-chart-error" role="status" hidden></p></div>
          <p class="scenic-hint scenic-chart-note">按入库时间统计，含历史回填和后续归档、合并的记录。</p>
        </section>
      </div>
      </details>
      <div id="providerSyncProgress" class="scenic-hint mt-3" role="status" hidden></div>
    </section>
    <section class="panel p-0">
      <div class="scenic-directory-header">
        <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-3">
          <h2>景点目录</h2>
          <button id="newBtn" type="button" data-admin-write="scenic_spots" class="btn btn-primary">新增景点</button>
        </div>
      <div class="scenic-search">
        <label class="search-name">名称搜索<input id="searchInput" class="form-control" type="search" placeholder="景点名称" /></label>
        <label class="search-city">省份筛选<select id="provinceFilter" class="form-select"><option value="">全部省份</option></select></label>
        <label class="search-city">城市筛选<select id="cityFilter" class="form-select"><option value="">全部城市</option></select></label>
        <label class="search-mode">资料类型<select id="statusFilter" class="form-select"><option value="">全部</option><option value="automatic">自动</option><option value="manual">人工</option></select></label>
        <label class="search-mode">资料缺项<select id="missingFilter" class="form-select"><option value="">全部</option><option value="any">待完善</option><option value="description">缺简介</option><option value="photos">无图片</option><option value="coordinates">缺有效坐标</option><option value="address">缺地址</option></select></label>
        <button id="searchBtn" type="button" class="btn btn-outline-secondary">查询</button>
      </div>
      <div id="spotCount" class="scenic-hint mt-3" role="status"></div>
      </div>
      <div class="scenic-catalog-wrap"><table class="scenic-catalog scenic-catalog-main"><thead><tr><th>景点名</th><th>城市</th><th>等级</th><th>资料类型</th><th class="scenic-number">图片</th><th class="scenic-number">相关轨迹</th></tr></thead><tbody id="spotRows"><tr><td colspan="6" class="p-3 scenic-hint">加载中</td></tr></tbody></table></div>
      <div class="p-3 text-center"><button id="loadMoreSpotsBtn" type="button" class="btn btn-outline-secondary" hidden>加载更多景点</button></div>
    </section>
  </main>
  <dialog id="detailModal" class="scenic-modal" aria-labelledby="detailTitle"><div id="detailPanel" data-admin-fields="scenic_spots" class="scenic-modal-body">
    <div class="scenic-detail-head scenic-detail-sticky"><div><div class="scenic-title-row"><h2 id="detailTitle">景点资料</h2><span id="cityInfo" class="scenic-city-tag">暂无</span></div><div class="scenic-detail-actions"><span id="detailMode" class="scenic-mode"></span><span id="detailMeta" class="scenic-hint"></span><button id="copySpotIdBtn" type="button" class="btn btn-sm scenic-copy-id" aria-label="复制景点内部 ID" title="复制内部 ID" disabled><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="7" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button></div></div><span class="spacer"></span><button id="closeDetailBtn" type="button" class="btn btn-outline-secondary scenic-close-icon" aria-label="关闭" title="关闭"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m18 6-12 12M6 6l12 12"/></svg></button></div>
    <div id="newCityFields" class="scenic-new-city-fields mt-3" hidden><label>省份<select id="newProvinceSelect" class="form-select"><option value="">选择省份</option></select></label><label>城市<select id="newCitySelect" class="form-select" disabled><option value="">先选择省份</option></select></label></div>
    <div class="scenic-fields mt-3">
      <label class="full">景点名称<input id="nameInput" class="form-control" maxlength="160" /><small id="providerNameHint" class="scenic-provider-hint"></small></label>
      <label class="scenic-classification-field">分类<input id="categoryInput" class="form-control" maxlength="100" /><small id="providerCategoryHint" class="scenic-provider-hint"></small></label>
      <label class="scenic-classification-field">景区等级<select id="scenicGradeInput" class="form-select"><option value="">暂无等级</option><option value="1A">1A</option><option value="2A">2A</option><option value="3A">3A</option><option value="4A">4A</option><option value="5A">5A</option></select><small id="scenicGradeHint" class="scenic-provider-hint"></small></label>
      <label class="full">地址<input id="addressInput" class="form-control" maxlength="500" /><small id="providerAddressHint" class="scenic-provider-hint"></small></label>
    <section class="scenic-location full" aria-label="地图位置">
      <div class="scenic-location-header">
        <div>
          <div id="coordinateInfo" class="scenic-hint"></div>
          <div id="pendingCoordinateInfo" class="scenic-hint scenic-position-pending" role="status" hidden></div>
        </div>
        <button id="toggleScenicMapBtn" type="button" class="btn btn-sm btn-outline-secondary" aria-expanded="false" aria-controls="scenicMapContent">查看地图</button>
      </div>
      <div id="scenicMapContent" hidden aria-busy="false">
        <div id="coordinateMapActions" data-admin-write="scenic_spots" class="scenic-map-actions" hidden>
          <button id="chooseMapLocationBtn" type="button" class="btn btn-sm btn-outline-secondary" aria-controls="coordinateMapCanvas">重新选点</button>
          <button id="resetMapLocationBtn" type="button" class="btn btn-sm btn-outline-secondary" hidden>撤销本次选点</button>
          <span id="coordinateMapActionHint" class="scenic-hint" role="status"></span>
        </div>
<div id="coordinateMap" class="scenic-coordinate-map" hidden><img id="coordinateMapImage" alt="景点位置地图" loading="lazy" /><div id="coordinateMapCanvas" class="scenic-map-canvas"></div><div id="coordinateMapError" class="scenic-map-error" hidden></div></div><div id="poiCandidatePanel" data-admin-write="scenic_spots" class="scenic-poi-panel" hidden><div class="scenic-poi-head"><strong id="poiCandidateTitle">附近高德景点</strong><button id="useClickedLocationBtn" type="button" class="btn btn-sm btn-outline-secondary">按此坐标新建</button></div><div id="poiCandidateList" class="scenic-poi-list"></div><section id="poiDraftPanel" class="scenic-poi-draft" hidden><strong>景点资料备选</strong><div class="scenic-poi-draft-fields mt-2"><span class="scenic-poi-draft-label">景点名</span><span id="poiDraftName">—</span><span class="scenic-poi-draft-label">分类</span><span id="poiDraftCategory">—</span><span class="scenic-poi-draft-label">简介</span><span id="poiDraftDescription" class="scenic-poi-draft-description">供应商未提供</span><span class="scenic-poi-draft-label">地址</span><span id="poiDraftAddress">—</span><span class="scenic-poi-draft-label">坐标 / POI ID</span><span id="poiDraftLocation">—</span></div><div id="providerPhotoPanel" class="scenic-provider-photo-panel" hidden><strong>备选图片</strong><div id="providerPhotoCandidates" class="scenic-provider-photo-grid"></div></div><div class="scenic-poi-draft-actions"><button id="applyPoiDraftBtn" type="button" class="btn btn-primary">一键代入资料及图片</button></div></section></div><div id="coordinateMapHelp" class="scenic-map-help" hidden>点击地图上的景点，或选点查找附近景点</div>
      </div>
    </section>
      <label class="full"><span class="scenic-description-heading"><span>简介</span><a id="generateDescriptionBtn" data-admin-write="scenic_spots" href="#" class="scenic-description-link">AI联网查询</a></span><textarea id="descriptionInput" class="form-control" rows="3" maxlength="8000"></textarea><small id="providerDescriptionHint" class="scenic-provider-hint" role="status"></small><div id="aiDescriptionCandidate" class="scenic-ai-candidate" hidden><div id="aiDescriptionCandidateText" class="scenic-ai-candidate-text"></div><div class="scenic-ai-candidate-actions"><button id="applyAiDescriptionBtn" data-admin-write="scenic_spots" type="button" class="btn btn-sm btn-primary">一键代入</button></div></div></label>
    </div>
    <section class="mt-3" id="userScenicPhotos" hidden aria-labelledby="userScenicTitle"><h3 id="userScenicTitle">景点图片选用 · 用户实拍</h3><div class="photo-grid" id="userScenicItems"></div><p class="photo-message" role="status" id="userScenicMessage"></p><button type="button" class="btn btn-outline-secondary" id="userScenicMore" hidden>加载更多</button></section>
    <section class="mt-3"><div class="d-flex align-items-baseline flex-wrap gap-2"><h3 class="mb-0">景点图片</h3><div id="scenicPhotoSaveStatus" class="scenic-photo-status" data-admin-write="scenic_spots"></div></div><div id="photosBox" aria-describedby="scenicPhotoOrderHint"></div><div id="scenicPhotoOrderHint" class="scenic-hint mt-1" data-admin-write="scenic_spots">拖动可调整展示顺序</div></section>
    <div id="deleteSpotError" class="alert alert-danger mt-3" role="alert" hidden></div>
  </div><div class="scenic-detail-footer"><div><button id="deleteSpotBtn" type="button" data-admin-write="scenic_spots" class="btn btn-outline-danger" hidden>归档景点</button></div><button id="saveBtn" data-admin-write="scenic_spots" class="btn btn-primary" disabled>保存景点资料</button></div>
  </dialog>
  <dialog id="discardScenicDialog" class="scenic-discard" aria-labelledby="discardScenicTitle">
    <form method="dialog">
      <h2 id="discardScenicTitle">放弃未保存的修改？</h2>
      <p>关闭详情会丢失本次尚未保存的景点资料。</p>
      <div class="d-flex justify-content-end gap-2">
        <button type="submit" value="keep" class="btn btn-outline-secondary" autofocus>继续编辑</button>
        <button type="submit" value="discard" class="btn btn-danger">放弃修改</button>
      </div>
    </form>
  </dialog>
  <dialog id="relatedTracksModal" class="scenic-modal"><div class="scenic-modal-body"><div class="scenic-detail-head"><div><h2 id="relatedTracksTitle" class="mb-0">相关轨迹</h2><div id="relatedTracksHint" class="scenic-hint mt-1"></div></div><span class="spacer"></span><button id="closeRelatedTracksBtn" type="button" class="btn btn-outline-secondary scenic-close-icon" aria-label="关闭" title="关闭"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m18 6-12 12M6 6l12 12"/></svg></button></div><div class="scenic-catalog-wrap"><table class="scenic-catalog scenic-related-table"><thead><tr><th>ID</th><th>城市</th><th>标题</th><th>类型</th><th>用户名</th><th>轨迹图</th><th>状态</th><th>操作</th></tr></thead><tbody id="relatedTracksList"></tbody></table></div><div class="d-flex justify-content-center mt-3"><button id="loadMoreRelatedTracksBtn" type="button" class="btn btn-outline-secondary" hidden>加载更多</button></div></div></dialog>

  <script src="/admin/static/ui.js"></script><script src="/admin/static/place_candidates.js"></script><script src="/admin/static/track_map_preview.js"></script><script src="/admin/static/workout_photos.js"></script>
  <script src="/admin/static/track_detail_photos.js"></script>
  <script src="/admin/static/track_editor.js"></script><script src="/admin/static/admin_usage_charts.js"></script><script src="/admin/static/scenic_spot_charts.js"></script><script src="/admin/static/photo_upload_editor.js"></script><script src="/admin/static/region_picker.js"></script>
  <script src="/admin/static/scenic_user_photos.js"></script>
<script src="/admin/static/scenic_spots.js"></script>
</body>
