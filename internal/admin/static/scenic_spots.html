<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>景点管理 - Track</title>
  <link rel="stylesheet" href="/admin/static/vendor/tabler.min.css" />
  <link rel="stylesheet" href="/admin/static/style.css" />
  <style>
    .scenic-stats-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.scenic-stat{padding:16px;border:1px solid var(--tblr-border-color);border-radius:10px;background:var(--tblr-bg-surface)}.scenic-stat-label,.scenic-hint{color:var(--tblr-secondary-color);font-size:13px}.scenic-stat-value{font-size:25px;font-weight:650;margin-top:5px}.scenic-stat-note{font-size:12px;color:var(--tblr-secondary-color);margin-top:3px}.scenic-stats-lower{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(320px,1fr);gap:20px;margin-top:18px}.scenic-bars{height:100px;display:flex;align-items:end;gap:4px;padding:8px 4px 0;border-bottom:1px solid var(--tblr-border-color)}.scenic-bar-col{height:100%;flex:1;display:flex;align-items:end;min-width:4px}.scenic-bar{width:100%;min-height:2px;border-radius:3px 3px 0 0;background:var(--tblr-primary);opacity:.8}.scenic-bars-label{display:flex;justify-content:space-between;color:var(--tblr-secondary-color);font-size:11px;margin-top:5px}.scenic-top-list{display:grid;gap:8px}.scenic-top-item{display:grid;grid-template-columns:32px 1fr auto;gap:9px;align-items:center;padding:8px;border-bottom:1px solid var(--tblr-border-color);cursor:pointer}.scenic-top-item:hover{background:var(--tblr-bg-surface-secondary)}.scenic-medal{font-size:21px}.scenic-search{display:flex;gap:12px;align-items:end;flex-wrap:wrap}.scenic-catalog-wrap{overflow-x:auto}.scenic-catalog{width:100%;min-width:820px;border-collapse:collapse}.scenic-catalog th,.scenic-catalog td{padding:10px 14px;border-top:1px solid var(--tblr-border-color);vertical-align:middle}.scenic-catalog th{font-size:12px;font-weight:600;color:var(--tblr-secondary-color);white-space:nowrap}.scenic-catalog td{font-size:14px}.scenic-catalog tbody tr:hover{background:var(--tblr-bg-surface-secondary)}.scenic-catalog .city-cell{min-width:110px}.scenic-catalog .name-cell{font-weight:650;min-width:150px}.scenic-catalog .category-cell{max-width:260px;color:var(--tblr-secondary-color)}.scenic-row-photos{display:flex;gap:5px;min-width:150px}.scenic-row-photos img{width:48px;height:40px;object-fit:cover;border-radius:5px;background:var(--tblr-bg-surface-secondary)}.scenic-mode{font-size:12px;border-radius:20px;padding:2px 9px;background:var(--tblr-bg-surface-secondary);color:var(--tblr-secondary-color);white-space:nowrap}.scenic-mode.manual{background:#eaf2ff;color:#206bc4}.scenic-mode.automatic{background:#eaf7ef;color:#2b8a3e}.scenic-modal{width:min(960px,calc(100vw - 32px));max-height:calc(100vh - 32px);padding:0;border:0;border-radius:12px;box-shadow:0 20px 70px #18243340}.scenic-modal::backdrop{background:#18243380}.scenic-modal-body{padding:20px;overflow:auto;max-height:calc(100vh - 32px)}.scenic-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.scenic-fields label{display:grid;gap:6px}.scenic-fields .full{grid-column:1/-1}.scenic-photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:10px}.scenic-photo{border:1px solid var(--tblr-border-color);border-radius:8px;padding:7px;background:var(--tblr-bg-surface)}.scenic-photo img{width:100%;height:105px;object-fit:cover;border-radius:5px}.scenic-photo input{margin-top:6px}.scenic-city-tag{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;background:#eaf2ff;color:#206bc4;font-weight:650;border:1px solid #cfe0fb}.scenic-detail-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.scenic-detail-head .spacer{flex:1}
    @media(max-width:900px){.scenic-stats-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.scenic-stats-lower{grid-template-columns:1fr}.scenic-fields{grid-template-columns:1fr}.scenic-fields .full{grid-column:auto}}
    @media(max-width:560px){.scenic-stats-grid{gap:8px}.scenic-stat{padding:12px}}
    .scenic-spots-page .scenic-stats-panel,.scenic-spots-page .scenic-filter-panel{padding:22px 24px!important;overflow:visible;border:1px solid var(--tblr-border-color);border-radius:var(--tblr-border-radius-lg);box-shadow:var(--tblr-box-shadow-card)}
    .scenic-stats-panel h2{margin:0 0 4px;font-size:18px;line-height:1.35}.scenic-stats-grid{margin-top:18px}.scenic-spots-page .scenic-stats-grid .scenic-stat{min-width:0;padding:18px 20px!important}.scenic-stat-note{line-height:1.45}.scenic-stats-lower>div{min-width:0}.scenic-stats-lower h3{margin:0 0 12px;font-size:15px;line-height:1.4}.scenic-bars{padding-inline:6px}.scenic-top-list{min-width:0}.scenic-top-item{grid-template-columns:28px minmax(0,1fr) auto;min-width:0}.scenic-top-item strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .scenic-search{gap:14px 16px}.scenic-search label{display:grid;gap:6px;color:var(--tblr-secondary-color);font-size:12px;font-weight:600}.scenic-search .search-name{flex:1 1 240px;max-width:420px}.scenic-search .search-city{flex:0 1 220px}.scenic-search .search-mode{flex:0 1 170px}.scenic-search .form-control,.scenic-search .form-select{min-height:38px}
    @media(max-width:900px){.scenic-spots-page .scenic-stats-panel,.scenic-spots-page .scenic-filter-panel{padding:18px!important}.scenic-stats-lower{gap:22px}}
    @media(max-width:560px){.scenic-spots-page .scenic-stats-panel,.scenic-spots-page .scenic-filter-panel{padding:14px!important}.scenic-spots-page .scenic-stats-grid .scenic-stat{padding:12px!important}.scenic-stats-grid{grid-template-columns:1fr 1fr}.scenic-stat-value{font-size:22px}.scenic-search .search-name,.scenic-search .search-city,.scenic-search .search-mode{flex:1 1 100%;max-width:none}.scenic-search>button{flex:1 1 auto}}
    .scenic-photo{cursor:grab}.scenic-photo:active{cursor:grabbing}.scenic-photo.dragging{opacity:.45}.scenic-photo.drop-target{outline:2px solid var(--tblr-primary)}.scenic-photo-source{font-size:11px;color:var(--tblr-secondary-color);margin-top:3px}.scenic-provider-hint{font-size:12px;color:var(--tblr-secondary-color);font-weight:400}
    .scenic-coordinate-map{position:relative;margin-top:10px;border:1px solid var(--tblr-border-color);border-radius:8px;overflow:hidden;background:var(--tblr-bg-surface-secondary)}.scenic-coordinate-map>#coordinateMapImage,.scenic-map-canvas{display:block;width:100%;height:280px}.scenic-coordinate-map>#coordinateMapImage{object-fit:cover}.scenic-map-canvas{position:absolute;inset:0}.scenic-map-canvas.selecting-location,.scenic-map-canvas.selecting-location *{cursor:crosshair!important}.scenic-coordinate-map[hidden]{display:none}.scenic-map-error{position:absolute;left:10px;bottom:10px;padding:6px 10px;border-radius:6px;background:#ffffffdf;color:var(--tblr-secondary-color);font-size:12px;pointer-events:none}.scenic-map-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px}.scenic-map-actions[hidden]{display:none}.scenic-map-actions .scenic-hint{font-size:12px}.scenic-map-help{font-size:12px;color:var(--tblr-secondary-color);margin-top:5px}
    .scenic-title-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.scenic-title-row h2{margin:0!important}.scenic-city-tag{padding:4px 9px;font-size:12px}.scenic-detail-actions{display:flex;align-items:center;gap:14px;margin-top:5px}.scenic-detail-actions .scenic-hint{margin-left:2px}.scenic-copy-id{display:inline-flex;align-items:center;justify-content:center;padding:3px 4px!important;border:0!important;background:transparent!important;color:var(--tblr-secondary-color)!important;box-shadow:none!important}.scenic-copy-id:hover{color:var(--tblr-primary)!important;background:var(--tblr-bg-surface-secondary)!important}.scenic-close-icon{padding:5px!important;line-height:0}
    .scenic-save-hint{font-size:13px;color:var(--tblr-success);transition:opacity .2s ease}
  </style>
</head>
<body class="scenic-spots-page">
  <header class="topbar"></header>
  <main class="container wide">
    <section class="panel scenic-stats-panel">
      <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-3"><div><h2 class="mb-1">运营统计</h2><div id="statsPeriod" class="scenic-hint"></div></div><button id="refreshStatsBtn" class="btn btn-sm btn-outline-secondary">刷新</button></div>
      <div class="scenic-stats-grid">
        <div class="scenic-stat"><div class="scenic-stat-label">自有景点</div><div id="statsPublished" class="scenic-stat-value">—</div><div id="statsPublishedNote" class="scenic-stat-note">已发布</div></div>
        <div class="scenic-stat"><div class="scenic-stat-label">已关联轨迹</div><div id="statsCoveredTracks" class="scenic-stat-value">—</div><div id="statsCoveredNote" class="scenic-stat-note">发布景点覆盖轨迹</div></div>
        <div class="scenic-stat"><div class="scenic-stat-label">今日地图查询</div><div id="statsTodayCalls" class="scenic-stat-value">—</div><div class="scenic-stat-note">已关联景点的详情与图片</div></div>
        <div class="scenic-stat"><div class="scenic-stat-label">近 30 日地图查询</div><div id="statsMonthCalls" class="scenic-stat-value">—</div><div id="statsMonthNote" class="scenic-stat-note">成功与失败请求</div></div>
      </div>
      <div class="scenic-stats-lower"><div><h3>近 30 日查询趋势</h3><div id="statsDailyBars" class="scenic-bars"></div><div id="statsDailyLabels" class="scenic-bars-label"></div></div><div><h3>高调用景点 · 近 30 日</h3><div id="statsTopSpots" class="scenic-top-list"><div class="scenic-hint">加载中</div></div></div></div>
      <div id="providerSyncProgress" class="scenic-hint mt-3" hidden></div>
    </section>
    <section class="panel scenic-filter-panel">
      <div class="scenic-search">
        <label class="search-name">名称搜索<input id="searchInput" class="form-control" type="search" placeholder="景点名称" /></label>
        <label class="search-city">城市筛选<select id="cityFilter" class="form-select"><option value="">全部城市</option></select></label>
        <label class="search-mode">资料状态<select id="statusFilter" class="form-select"><option value="">全部</option><option value="automatic">自动</option><option value="manual">人工</option></select></label>
        <button id="searchBtn" class="btn btn-primary">查询</button><button id="newBtn" class="btn btn-outline-primary">新建景点</button>
      </div>
    </section>
    <section class="panel p-0">
      <div class="d-flex align-items-center justify-content-between p-3"><h2 class="mb-0">景点目录</h2><span id="spotCount" class="scenic-hint"></span></div>
      <div class="scenic-catalog-wrap"><table class="scenic-catalog"><thead><tr><th>城市</th><th>景点名</th><th>分类</th><th>类型</th><th>图片</th><th>操作</th></tr></thead><tbody id="spotRows"><tr><td colspan="6" class="p-3 scenic-hint">加载中</td></tr></tbody></table></div>
    </section>
  </main>
  <dialog id="detailModal" class="scenic-modal"><div id="detailPanel" class="scenic-modal-body">
    <div class="scenic-detail-head"><div><div class="scenic-title-row"><h2 id="detailTitle">景点资料</h2><span id="cityInfo" class="scenic-city-tag">暂无</span></div><div class="scenic-detail-actions"><span id="detailMode" class="scenic-mode"></span><span id="detailMeta" class="scenic-hint"></span><button id="copySpotIdBtn" type="button" class="btn btn-sm scenic-copy-id" aria-label="复制景点内部 ID" title="复制内部 ID" disabled><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="7" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button></div></div><span class="spacer"></span><button id="closeDetailBtn" type="button" class="btn btn-outline-secondary scenic-close-icon" aria-label="关闭" title="关闭"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m18 6-12 12M6 6l12 12"/></svg></button></div>
    <div id="coordinateInfo" class="scenic-hint mt-2" hidden></div><div id="coordinateMap" class="scenic-coordinate-map" hidden><img id="coordinateMapImage" alt="景点位置地图" loading="lazy" /><div id="coordinateMapCanvas" class="scenic-map-canvas"></div><div id="coordinateMapError" class="scenic-map-error" hidden></div></div><div id="coordinateMapActions" class="scenic-map-actions" hidden><button id="chooseMapLocationBtn" type="button" class="btn btn-sm btn-outline-primary">重新选点</button><button id="resetMapLocationBtn" type="button" class="btn btn-sm btn-outline-secondary" disabled>复位</button><span id="coordinateMapActionHint" class="scenic-hint">地图点击仅用于浏览；选点请先点击“重新选点”。</span></div><div id="coordinateMapHelp" class="scenic-map-help" hidden>拖动地图浏览，滚轮或缩放控件调整比例；点选位置需先进入选点模式。</div>
    <div class="scenic-fields mt-3">
      <label>景点名称<input id="nameInput" class="form-control" maxlength="160" /><small id="providerNameHint" class="scenic-provider-hint"></small></label>
      <label>分类<input id="categoryInput" class="form-control" maxlength="100" /><small id="providerCategoryHint" class="scenic-provider-hint"></small></label>
      <label class="full">地址<input id="addressInput" class="form-control" maxlength="500" /><small id="providerAddressHint" class="scenic-provider-hint"></small></label>
      <label class="full">简介<textarea id="descriptionInput" class="form-control" rows="3" maxlength="8000"></textarea><small id="providerDescriptionHint" class="scenic-provider-hint"></small></label>
    </div>
    <section class="mt-3"><div class="d-flex align-items-center flex-wrap gap-2"><h3 class="mb-0">景点图片</h3><input id="photoFile" type="file" accept="image/jpeg,image/png" /><input id="photoCaption" class="form-control" style="max-width:220px" placeholder="新图片说明" /><button id="uploadPhotoBtn" class="btn btn-outline-primary">添加图片</button></div><div class="scenic-hint mt-1">拖动图片调整顺序；新上传图片追加到末尾。图片说明直接编辑，保存后按当前顺序下发。</div><div id="photosBox" class="scenic-photo-grid"></div></section>
    <div class="d-flex align-items-center justify-content-end gap-2 mt-4"><span id="saveHint" class="scenic-save-hint" role="status" hidden>保存成功</span><button id="saveBtn" class="btn btn-primary">保存修改</button></div>
  </div></dialog>
  <script src="/admin/static/vendor/tabler.min.js"></script><script src="/admin/static/shell.js"></script><script src="/admin/static/ui.js"></script><script src="/admin/static/scenic_spots.js"></script>
</body>
</html>
