<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>同行详情 - Track</title>
  <link rel="stylesheet" href="/admin/static/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="title">Track 管理后台</div>
    <nav class="nav">
      <a href="/admin/index.html">App 发布</a>
      <a href="/admin/users.html">用户管理</a>
      <a href="/admin/tracks.html">轨迹管理</a>
      <a class="active" href="/admin/companions.html">同行管理</a>
    </nav>
    <div class="spacer"></div>
    <div class="user">
      <span id="userName"></span>
      <button id="logoutBtn">退出</button>
    </div>
  </header>

  <main class="container">
    <section class="panel">
      <h2>会话基本信息 <span class="hint"><a href="/admin/companions.html">返回列表</a></span></h2>
      <div id="sessionInfo" class="hint">加载中...</div>
    </section>

    <section class="panel">
      <h2>同行人员 <span class="hint" id="memberHint"></span></h2>
      <table class="data">
        <thead>
          <tr>
            <th>用户ID</th><th>头像</th><th>昵称</th><th>角色</th>
            <th>成员状态</th><th>在线</th><th>加入时间</th><th>最后活跃</th>
          </tr>
        </thead>
        <tbody id="memberList"></tbody>
      </table>
    </section>

    <section class="panel">
      <h2>实时位置（live_positions） <span class="hint" id="positionHint"></span></h2>
      <table class="data">
        <thead>
          <tr>
            <th>用户ID</th><th>纬度</th><th>经度</th><th>坐标系</th>
            <th>速度(km/h)</th><th>方向</th><th>精度(m)</th><th>海拔</th>
            <th>采样时间</th><th>seq</th><th>来源</th>
          </tr>
        </thead>
        <tbody id="positionList"></tbody>
      </table>
    </section>

    <section class="panel">
      <h2>弹幕历史（最近 200 条） <span class="hint" id="danmakuHint"></span></h2>
      <table class="data">
        <thead>
          <tr>
            <th>ID</th><th>用户ID</th><th>内容</th><th>时间</th>
          </tr>
        </thead>
        <tbody id="danmakuList"></tbody>
      </table>
    </section>
  </main>

  <script src="/admin/static/companion_detail.js"></script>
</body>
</html>
