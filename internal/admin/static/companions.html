<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>与友同行 - Track</title>
  <link rel="stylesheet" href="/admin/static/vendor/tabler.min.css" />
  <link rel="stylesheet" href="/admin/static/style.css" />
</head>
<body>
  <header class="topbar"></header>

  <main class="container wide companions-page">
    <div class="page-heading">
      <div><h1>与友同行</h1><p>查看同行房间、成员与活动记录</p></div>
      <button id="refreshBtn" class="btn btn-outline-secondary" type="button">刷新数据</button>
    </div>
    <section class="admin-companion-stats" aria-label="同行房间统计">
      <article class="admin-stat-panel"><span>进行中房间</span><strong id="companionActive">—</strong><small>当前尚未结束的房间</small></article>
      <article class="admin-stat-panel"><span>本月创建</span><strong id="companionCreated">—</strong><small id="companionCreatedCompare">上期 —</small></article>
      <article class="admin-stat-panel"><span>本月结束</span><strong id="companionEnded">—</strong><small id="companionAutoEnded">其中自动结束 —</small></article>
      <article class="admin-stat-panel"><span>平均参与人数</span><strong id="companionParticipants">—</strong><small>本月创建的房间</small></article>
    </section>
    <p id="companionStatsError" class="error" role="status" hidden></p>
    <section class="panel">
      <h2>同行房间 <span class="hint" id="totalHint"></span></h2>
      <form id="companionSearch" class="companion-search" role="search">
        <label for="titleFilter" class="visually-hidden">搜索房间标题</label>
        <input id="titleFilter" type="search" maxlength="128" placeholder="搜索房间标题" />
        <button id="searchBtn" class="btn btn-primary" type="submit">搜索</button>
        <button id="resetBtn" class="btn btn-outline-secondary" type="button" hidden>清除搜索</button>
      </form>
      <div class="table-responsive">
      <table class="data companion-list-table" aria-label="同行房间列表">
        <thead>
          <tr>
            <th>房间</th><th>运动类型</th><th>发起人 ID</th><th>房间状态</th><th>活动时间</th><th>操作</th>
          </tr>
        </thead>
        <tbody id="companionList"><tr><td colspan="6" class="companion-table-state">正在加载房间…</td></tr></tbody>
      </table>
      </div>
      <div class="companion-pagination">
        <span class="hint" id="pageHint" role="status" aria-live="polite"></span>
        <div><button id="prevBtn" class="btn btn-outline-secondary" type="button" disabled>上一页</button><button id="nextBtn" class="btn btn-outline-secondary" type="button" disabled>下一页</button></div>
      </div>
    </section>
  </main>

  <dialog id="companionDetailModal" class="companion-dialog" aria-labelledby="companionDetailTitle">
    <div class="companion-dialog-content">
      <div class="companion-dialog-heading"><div><h2 id="companionDetailTitle">同行房间详情</h2><div id="companionDetailSubtitle" class="hint"></div></div><div class="companion-dialog-actions"><button id="refreshCompanionDetail" type="button" class="btn btn-outline-secondary">刷新详情</button><button id="closeCompanionDetail" type="button" class="btn btn-outline-secondary">关闭</button></div></div>
      <div id="companionDetailError" class="error" role="alert" hidden></div>
      <p id="companionDetailLoading" class="hint" role="status" hidden>正在加载房间详情…</p>
      <div id="companionDetailBody" hidden>
        <section class="companion-detail-section"><div id="companionSessionInfo" class="companion-session-grid"></div></section>
        <p id="companionLocation" class="companion-location"></p>
        <nav class="companion-tabs" role="tablist" aria-label="房间详情">
          <button id="companionTabMembers" type="button" role="tab" aria-controls="companionPanelMembers" aria-selected="true" data-companion-tab="members">同行成员 <span id="companionMemberHint"></span></button>
          <button id="companionTabPositions" type="button" role="tab" aria-controls="companionPanelPositions" aria-selected="false" tabindex="-1" data-companion-tab="positions">位置快照 <span id="companionPositionHint"></span></button>
          <button id="companionTabDanmakus" type="button" role="tab" aria-controls="companionPanelDanmakus" aria-selected="false" tabindex="-1" data-companion-tab="danmakus">弹幕记录 <span id="companionDanmakuHint"></span></button>
        </nav>
        <section id="companionPanelMembers" class="companion-detail-section" role="tabpanel" aria-labelledby="companionTabMembers" data-companion-panel="members">
          <p id="companionPresenceHint" class="hint"></p>
          <div class="companion-detail-table-wrap"><table class="data"><thead><tr><th>用户</th><th>角色</th><th>成员状态</th><th>连接状态</th><th>加入时间</th><th>最后活跃</th></tr></thead><tbody id="companionMemberList"></tbody></table></div>
        </section>
        <section id="companionPanelPositions" class="companion-detail-section" role="tabpanel" aria-labelledby="companionTabPositions" data-companion-panel="positions" hidden>
          <p class="hint">仅展示已保存的最近位置，点击“刷新详情”更新。</p>
          <div class="companion-detail-table-wrap"><table class="data"><thead><tr><th>用户</th><th>经纬度 / 坐标系</th><th>速度 / 方向</th><th>精度 / 海拔</th><th>采样时间</th><th>来源 / 序号</th></tr></thead><tbody id="companionPositionList"></tbody></table></div>
        </section>
        <section id="companionPanelDanmakus" class="companion-detail-section" role="tabpanel" aria-labelledby="companionTabDanmakus" data-companion-panel="danmakus" hidden>
          <p class="hint">展示最近 200 条弹幕。</p>
          <div class="companion-detail-table-wrap"><table class="data"><thead><tr><th>发送人</th><th>内容</th><th>发送时间</th></tr></thead><tbody id="companionDanmakuList"></tbody></table></div>
        </section>
        <details class="companion-settings"><summary>房间设置与结束记录</summary><div id="companionSettingsInfo" class="companion-session-grid"></div></details>
      </div>
    </div>
  </dialog>

  <script src="/admin/static/vendor/tabler.min.js"></script>
  <script src="/admin/static/shell.js"></script>
  <script src="/admin/static/ui.js"></script>
  <script src="/admin/static/companions.js"></script>
</body>
</html>
