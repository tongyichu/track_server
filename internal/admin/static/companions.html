<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>同行管理 - Track</title>
  <link rel="stylesheet" href="/admin/static/vendor/tabler.min.css" />
  <link rel="stylesheet" href="/admin/static/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="title">Track 管理后台</div>
    <nav class="nav">
      <a href="/admin/index.html">App 发布</a>
      <a href="/admin/users.html">用户管理</a>
      <a href="/admin/tracks.html">轨迹管理</a>
      <a href="/admin/route_groups.html">聚合路线</a>
      <a class="active" href="/admin/companions.html">同行管理</a>
      <a href="/admin/feedbacks.html">意见反馈</a>
      <a href="/admin/analytics.html">埋点同步</a>
    </nav>
    <div class="spacer"></div>
    <div class="user">
      <span id="userName"></span>
      <button id="logoutBtn">退出</button>
    </div>
  </header>

  <main class="container">
    <section class="admin-companion-stats" aria-label="同行会话统计">
      <article class="admin-stat-panel"><span>当前活跃</span><strong id="companionActive">—</strong><small>此刻状态为 active</small></article>
      <article class="admin-stat-panel"><span>本月创建</span><strong id="companionCreated">—</strong><small id="companionCreatedCompare">较上期 —</small></article>
      <article class="admin-stat-panel"><span>本月结束</span><strong id="companionEnded">—</strong><small>按结束时间统计</small></article>
      <article class="admin-stat-panel"><span>自动结束</span><strong id="companionAutoEnded">—</strong><small>本月结束会话中的自动关闭</small></article>
      <article class="admin-stat-panel"><span>平均参与人数</span><strong id="companionParticipants">—</strong><small>本月创建会话</small></article>
    </section>
    <section class="panel">
      <h2>同行会话列表 <span class="hint" id="totalHint"></span></h2>
      <div class="row">
        <label>标题搜索 <input id="titleFilter" type="search" placeholder="输入同行会话标题关键词" /></label>
        <button id="searchBtn">搜索</button>
        <button id="refreshBtn">刷新</button>
        <button id="prevBtn" disabled>上一页</button>
        <button id="nextBtn" disabled>下一页</button>
        <span class="hint" id="pageHint"></span>
      </div>
      <table class="data">
        <thead>
          <tr>
            <th>SessionID</th><th>发起人</th><th>标题</th><th>类型</th>
            <th>状态</th><th>可见性</th><th>弹幕</th><th>最大成员</th>
            <th>开始时间</th><th>结束时间</th>
          </tr>
        </thead>
        <tbody id="companionList"></tbody>
      </table>
    </section>
  </main>

  <script src="/admin/static/vendor/tabler.min.js"></script>
  <script src="/admin/static/shell.js"></script>
  <script src="/admin/static/ui.js"></script>
  <script src="/admin/static/companions.js"></script>
</body>
</html>
