<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>轨迹投稿审核 - Track</title>
  <link rel="stylesheet" href="/admin/static/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="title">Track 管理后台</div>
    <nav class="nav">
      <a href="/admin/index.html">App 发布</a><a href="/admin/users.html">用户管理</a>
      <a href="/admin/tracks.html">轨迹管理</a><a class="active" href="/admin/track_submissions.html">投稿审核</a>
      <a href="/admin/route_groups.html">聚合路线</a><a href="/admin/companions.html">同行管理</a>
      <a href="/admin/feedbacks.html">意见反馈</a><a href="/admin/analytics.html">埋点同步</a>
    </nav>
    <div class="spacer"></div><div class="user"><span id="userName"></span><button id="logoutBtn">退出</button></div>
  </header>
  <main class="container wide">
    <section class="panel">
      <h2>轨迹投稿审核</h2>
      <div class="row">
        <select id="status"><option value="pending">待审核</option><option value="approved">已通过</option><option value="rejected">已驳回</option><option value="withdrawn">已撤回</option><option value="invalidated">已失效</option><option value="">全部</option></select>
        <button id="refreshBtn">刷新</button>
      </div>
      <table class="data"><thead><tr><th>投稿ID</th><th>轨迹ID</th><th>标题</th><th>类型</th><th>难度</th><th>风险</th><th>状态</th><th>版本</th><th>提交时间</th><th>操作</th></tr></thead><tbody id="list"></tbody></table>
    </section>
    <section class="panel" id="detailPanel" hidden>
      <h2 id="detailTitle">投稿详情</h2><div id="detail"></div>
      <div class="row"><input id="reviewReason" placeholder="驳回原因（驳回时必填）" class="flex1" /><button id="approveBtn">通过</button><button id="rejectBtn" class="danger">驳回</button></div>
    </section>
  </main>
  <script src="/admin/static/track_submissions.js"></script>
</body>
</html>
