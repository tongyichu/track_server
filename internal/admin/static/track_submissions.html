<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>时光轨迹 - 控制台</title>
  <link rel="stylesheet" href="/admin/static/vendor/tabler.min.css" />
  <link rel="stylesheet" href="/admin/static/style.css" />
  <link rel="stylesheet" href="/admin/static/track_submissions.css" />
</head>
<body>
  <header class="topbar">
    <div class="title">Track 管理后台</div>
    <nav class="nav">
      <a href="/admin/index.html">发布管理</a><a href="/admin/users.html">用户管理</a>
      <a href="/admin/tracks.html">轨迹管理</a><a class="active" href="/admin/track_submissions.html">投稿审核</a>
      <a href="/admin/route_groups.html">地图模式</a><a href="/admin/companions.html">与友同行</a>
      <a href="/admin/feedbacks.html">意见反馈</a><a href="/admin/analytics.html">埋点同步</a>
    </nav>
    <div class="spacer"></div><div class="user"><span id="userName"></span><button id="logoutBtn">退出</button></div>
  </header>
  <main class="container wide">
    <div class="submission-stat-sections" aria-live="polite">
      <section class="submission-stat-section">
        <div class="submission-stat-heading"><h2>待审核队列</h2><span>用于安排当前审核优先级</span></div>
        <div class="submission-stat-grid submission-queue-grid">
          <article class="panel submission-stat-card"><span>当前待审核</span><strong id="submissionPending">—</strong><small>所有待审核投稿</small></article>
          <article class="panel submission-stat-card submission-stat-warning"><span>待审核超 24 小时</span><strong id="submissionOver24">—</strong><small>需要优先处理</small></article>
          <article class="panel submission-stat-card submission-stat-danger"><span>待审核超 72 小时</span><strong id="submissionOver72">—</strong><small>长期未处理</small></article>
        </div>
      </section>
      <section class="submission-stat-section">
        <div class="submission-stat-heading"><h2>本月审核结果</h2><span>按审核完成时间统计</span></div>
        <div class="submission-stat-grid submission-result-grid">
          <article class="panel submission-stat-card"><span>审核通过</span><strong id="submissionApproved">—</strong><small>本月通过投稿数</small></article>
          <article class="panel submission-stat-card"><span>审核驳回</span><strong id="submissionRejected">—</strong><small>本月驳回投稿数</small></article>
          <article class="panel submission-stat-card"><span>通过率</span><strong id="submissionApprovalRate">—</strong><small>通过数 / 通过与驳回数</small></article>
          <article class="panel submission-stat-card"><span>平均审核时长</span><strong id="submissionAvgHours">—</strong><small>从提交到审核完成</small></article>
        </div>
      </section>
    </div>
    <section class="panel">
      <h2>轨迹投稿审核</h2>
      <div class="submission-list-toolbar">
        <label for="status" class="visually-hidden">投稿状态</label>
        <select id="status" class="form-select"><option value="pending">待审核</option><option value="approved">已通过</option><option value="rejected">已驳回</option><option value="withdrawn">已撤回</option><option value="invalidated">已失效</option><option value="">全部</option></select>
        <button id="refreshBtn" type="button" class="btn btn-outline-secondary">刷新</button>
      </div>
      <div class="table-responsive"><table class="data submission-list-table"><thead><tr><th>轨迹编号</th><th>标题</th><th>类型</th><th>难度</th><th>风险</th><th>状态</th><th>版本</th><th>提交时间</th><th>操作</th></tr></thead><tbody id="list"></tbody></table></div>
    </section>
  </main>
  <div class="modal modal-blur fade submission-detail-modal" id="submissionDetailModal" tabindex="-1" aria-hidden="true" aria-labelledby="detailTitle">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-xl">
      <div class="modal-content">
        <div class="modal-header"><div class="submission-modal-heading"><h2 class="modal-title" id="detailTitle">投稿详情</h2><p id="detailSubtitle" class="text-secondary"></p></div><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button></div>
        <div class="modal-body">
          <p id="detailLoading" class="submission-loading" role="status" hidden>正在加载投稿详情…</p>
          <div id="detailError" class="alert alert-danger" role="alert" hidden><span id="detailErrorText"></span><button id="retryDetail" type="button" class="btn btn-sm btn-outline-danger">重新加载</button></div>
          <div id="detail" hidden></div>
          <section id="reviewSection" class="submission-detail-section submission-review-section" data-admin-write="track_submissions" hidden>
            <h3>审核意见</h3><label for="reviewReason" class="form-label">备注或驳回原因</label><textarea id="reviewReason" data-admin-input="track_submissions" class="form-control" rows="3" placeholder="驳回时必须填写原因；通过时可填写备注。"></textarea><p id="reviewError" class="text-danger" role="alert" hidden></p>
          </section>
        </div>
        <div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">关闭</button><button id="rejectBtn" type="button" data-admin-write="track_submissions" class="btn btn-danger" hidden>驳回投稿</button><button id="approveBtn" type="button" data-admin-write="track_submissions" class="btn btn-primary" hidden>通过投稿</button></div>
      </div>
    </div>
  </div>
  <script src="/admin/static/vendor/tabler.min.js"></script>
  <script src="/admin/static/shell.js"></script>
  <script src="/admin/static/ui.js"></script>
  <script src="/admin/static/track_submissions.js"></script>
</body>
</html>
