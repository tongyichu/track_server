<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>时光轨迹 - 控制台</title>
  <link rel="stylesheet" href="/admin/static/admin-components.css" />
  <link rel="stylesheet" href="/admin/static/style.css" />
  <link rel="stylesheet" href="/admin/static/track_submissions.css" />
  <link rel="stylesheet" href="/admin/static/admin_stats.css" />
</head>
<body>
  <header class="topbar">
    <div class="title">Track 管理后台</div>
    <nav class="nav">
      <a href="/admin/index.html">发布管理</a><a href="/admin/users.html">用户管理</a>
      <a href="/admin/tracks.html">轨迹管理</a><a class="active" href="/admin/track_submissions.html">内容审核</a>
      <a href="/admin/route_groups.html">地图模式</a><a href="/admin/companions.html">与友同行</a>
      <a href="/admin/feedbacks.html">意见反馈</a><a href="/admin/analytics.html">埋点同步</a>
    </nav>
    <div class="spacer"></div><div class="user"><span id="userName"></span><button id="logoutBtn">退出</button></div>
  </header>
  <main class="container wide">
    <div class="d-flex gap-2 mb-3" aria-label="审核队列">
      <button id="routesTab" class="btn btn-primary" aria-pressed="true">路线投稿 <span id="routePending"></span></button>
      <button id="photosTab" class="btn btn-outline-secondary" aria-pressed="false">轨迹照片 <span id="photoPending"></span></button>
    </div>
    <section id="photoPanel" class="panel" hidden>
      <div class="d-flex flex-wrap align-items-center gap-2">
        <select id="photoFilter" class="form-select w-auto" aria-label="照片状态"><option value="pending">待审核</option><option value="approved">已通过</option><option value="rejected">已驳回</option></select>
        <button id="photoRefresh" class="btn btn-outline-secondary">刷新</button>
        <input id="photoReason" class="form-control w-auto" maxlength="250" placeholder="驳回原因" aria-label="驳回原因" data-admin-write="track_submissions">
        <button id="photoApprove" class="btn btn-primary" data-admin-write="track_submissions">通过所选</button>
        <button id="photoReject" class="btn btn-danger" data-admin-write="track_submissions">驳回所选</button>
      </div>
      <p id="photoMessage" role="status"></p><div id="photoList"></div>
      <div class="d-flex gap-2"><button id="photoPrev" class="btn btn-outline-secondary">上一页</button><button id="photoNext" class="btn btn-outline-secondary">下一页</button></div>
    </section>
    <div id="routesPanel">
    <div class="mb-3" aria-live="polite">
      <section class="submission-stat-section">
        <div class="admin-stats-heading"><h2>待审核队列</h2></div>
        <div class="admin-metrics">
          <button class="admin-metric" type="button" data-admin-metric data-review-age="" data-label="当前待审核" data-value-id="submissionPending" aria-pressed="true"></button>
          <button class="admin-metric" type="button" data-admin-metric data-review-age="24_72h" data-label="等待 24–72 小时" data-value-id="submissionOver24" aria-pressed="false"></button>
          <button class="admin-metric" type="button" data-admin-metric data-review-age="over_72h" data-label="等待超 72 小时" data-value-id="submissionOver72" aria-pressed="false"></button>
        </div>
      </section>
    </div>
    <section class="panel">
      <h2>投稿列表</h2>
      <div class="submission-list-toolbar">
        <label for="status" class="visually-hidden">投稿状态</label>
        <select id="status" class="form-select"><option value="pending">待审核</option><option value="approved">已通过</option><option value="rejected">已驳回</option><option value="withdrawn">已撤回</option><option value="invalidated">已失效</option><option value="">全部</option></select>
        <button id="refreshBtn" type="button" class="btn btn-outline-secondary">刷新</button>
        <span id="submissionAgeHint" class="text-secondary small"></span>
      </div>
      <div class="table-responsive"><table class="data submission-list-table"><thead><tr><th>投稿轨迹</th><th>类型</th><th>难度</th><th>风险</th><th>状态</th><th>提交时间</th><th>操作</th></tr></thead><tbody id="list"></tbody></table></div>
      <div class="companion-pagination">
        <span class="hint" id="submissionPageHint" role="status"></span>
        <div><button id="submissionPrev" class="btn btn-outline-secondary" type="button" disabled>上一页</button><button id="submissionNext" class="btn btn-outline-secondary" type="button" disabled>下一页</button></div>
      </div>
    </section>
    <details class="panel">
      <summary>本月审核结果</summary>
      <div class="admin-metrics mt-3 mb-0">
        <article class="admin-metric" data-admin-metric data-label="审核通过" data-value-id="submissionApproved"></article>
        <article class="admin-metric" data-admin-metric data-label="审核驳回" data-value-id="submissionRejected"></article>
        <article class="admin-metric" data-admin-metric data-label="通过率" data-value-id="submissionApprovalRate"></article>
        <article class="admin-metric" data-admin-metric data-label="平均审核时长" data-value-id="submissionAvgHours"></article>
      </div>
    </details>
    </div>
  </main>
  <dialog id="photoPreview"><div class="d-flex justify-content-end"><button type="button" class="btn-close" id="photoPreviewClose" aria-label="关闭"></button></div><img id="photoPreviewImage" alt="运动实拍" style="max-width:80vw;max-height:75vh;object-fit:contain"></dialog>
  <dialog class="modal submission-detail-modal" id="submissionDetailModal" aria-hidden="true" aria-labelledby="detailTitle">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-xl">
      <div class="modal-content">
        <div class="modal-header"><div class="submission-modal-heading"><h2 class="modal-title" id="detailTitle">投稿详情</h2><p id="detailSubtitle" class="text-secondary"></p></div><button type="button" class="btn-close" data-admin-dismiss="dialog" aria-label="关闭"></button></div>
        <div class="modal-body">
          <p id="detailLoading" class="submission-loading" role="status" hidden>正在加载投稿详情…</p>
          <div id="detailError" class="alert alert-danger" role="alert" hidden><span id="detailErrorText"></span><button id="retryDetail" type="button" class="btn btn-sm btn-outline-danger">重新加载</button></div>
          <div id="detail" hidden></div>
          <section id="reviewSection" class="submission-detail-section submission-review-section" data-admin-write="track_submissions" hidden>
            <h3>审核意见</h3><label for="reviewReason" class="form-label">备注或驳回原因</label><textarea id="reviewReason" data-admin-input="track_submissions" class="form-control" rows="3" placeholder="驳回时必须填写原因；通过时可填写备注。"></textarea><p id="reviewError" class="text-danger" role="alert" hidden></p>
          </section>
        </div>
        <div class="modal-footer" hidden><button id="rejectBtn" type="button" data-admin-write="track_submissions" class="btn btn-danger" hidden>驳回投稿</button><button id="approveBtn" type="button" data-admin-write="track_submissions" class="btn btn-primary" hidden>通过投稿</button></div>
      </div>
    </div>
  </dialog>
  <script src="/admin/static/admin-components.js"></script>
  <script src="/admin/static/shell.js"></script>
  <script src="/admin/static/admin_stats.js"></script>
  <script src="/admin/static/ui.js"></script>
  <script src="/admin/static/track_submissions.js"></script>
  <script src="/admin/static/track_photos.js"></script>
</body>
</html>
