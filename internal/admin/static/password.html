<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>账号安全 - Track</title>
  <link rel="stylesheet" href="/admin/static/vendor/tabler.min.css" />
  <link rel="stylesheet" href="/admin/static/style.css" />
</head>
<body>
  <header class="topbar"></header>
  <main class="container">
    <div class="page-heading"><div><h1>账号安全</h1><p id="passwordHint">仅管理本人的密码与找回邮箱。修改密码或验证邮箱后，全部旧登录会退出。</p></div></div>
    <section id="emailSecurityPanel" class="panel admin-password-panel">
      <h2>找回邮箱</h2>
      <p id="emailSecurityState" class="hint" role="status">正在加载…</p>
      <p id="emailSecurityError" class="error" role="alert" hidden></p>
      <p id="emailSecuritySuccess" class="ok" role="status" hidden></p>
      <div id="emailSecurityForms" hidden>
        <p class="hint">邮箱需由本人验证。更换邮箱时，还需要先验证原邮箱。管理员不能替你更改邮箱。</p>
        <form id="emailBindingForm" class="d-grid gap-3">
          <label class="form-label">当前密码<input name="password" class="form-control" type="password" required maxlength="72" autocomplete="current-password" /></label>
          <label class="form-label">新的找回邮箱<input name="email" class="form-control" type="email" required maxlength="254" autocomplete="email" /></label>
          <div id="currentEmailCodeGroup" hidden>
            <label class="form-label">原邮箱验证码<input name="current_code" class="form-control" type="text" inputmode="numeric" pattern="[0-9]{8}" maxlength="8" autocomplete="one-time-code" /></label>
            <button id="sendCurrentEmailCode" type="button" class="btn btn-outline-secondary">发送原邮箱验证码</button>
          </div>
          <button id="sendNewEmailCode" type="submit" class="btn btn-outline-primary">发送新邮箱验证码</button>
        </form>
        <form id="emailVerificationForm" class="d-grid gap-3 mt-4" hidden>
          <p id="pendingEmailHint" class="hint mb-0"></p>
          <label class="form-label">新邮箱验证码<input name="code" class="form-control" type="text" inputmode="numeric" pattern="[0-9]{8}" maxlength="8" required autocomplete="one-time-code" /></label>
          <button id="verifyRecoveryEmail" type="submit" class="btn btn-primary">验证并保存找回邮箱</button>
        </form>
      </div>
    </section>
    <section class="panel admin-password-panel">
      <h2>修改密码</h2>
      <form id="passwordForm" class="d-grid gap-3">
    <section class="panel admin-password-panel"><form id="passwordForm" class="d-grid gap-3">
      <label class="form-label">当前密码<input class="form-control" name="old_password" type="password" required autocomplete="current-password" /></label>
      <label class="form-label">新密码<input class="form-control" name="password" type="password" required minlength="8" maxlength="72" autocomplete="new-password" /><small class="form-hint">至少 8 个字符，不能与当前密码相同</small></label>
      <label class="form-label">确认新密码<input class="form-control" name="confirmation" type="password" required minlength="8" maxlength="72" autocomplete="new-password" /></label>
      <p id="passwordError" class="error" role="alert"></p><button id="changePassword" type="submit" class="btn btn-primary">保存新密码</button>
    </form></section>
  </main>
  <script src="/admin/static/vendor/tabler.min.js"></script>
  <script src="/admin/static/shell.js"></script>
  <script src="/admin/static/ui.js"></script>
  <script src="/admin/static/password.js"></script>
  <script src="/admin/static/account_security.js"></script>
</body>
</html>
