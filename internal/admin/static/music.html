<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>时光轨迹 - 控制台</title><link rel="stylesheet" href="/admin/static/vendor/tabler.min.css"><link rel="stylesheet" href="/admin/static/style.css"><link rel="stylesheet" href="/admin/static/music.css"></head>
<body><header class="topbar"></header><main class="container wide"><div class="page-heading"><div><h1>背景音乐</h1><p>管理 3D 轨迹视频的配乐</p></div><div class="d-flex gap-2"><button id="musicRefresh" class="btn btn-outline-secondary">刷新</button><button id="musicAdd" class="btn btn-primary" data-admin-write="music">添加音乐</button></div></div><section class="panel"><div class="table-responsive"><table class="data"><thead><tr><th>音乐</th><th>时长 / 大小</th><th>授权</th><th>排序</th><th>状态</th><th>操作</th></tr></thead><tbody id="musicList"></tbody></table></div><p id="musicError" role="status" class="error" hidden></p></section></main>
<dialog id="musicEditor" class="music-editor"><form id="musicForm" data-admin-fields="music"><div class="d-flex justify-content-between align-items-center"><h2 id="musicEditTitle">添加音乐</h2><button type="button" id="musicClose" class="btn btn-sm btn-outline-secondary">关闭</button></div><div class="music-fields">
<label>音乐名称<input name="name" required maxlength="80" class="form-control"></label><label>歌手 / 作者<input name="artist" required maxlength="80" class="form-control"></label>
<label>音频文件<input name="audio" type="file" accept=".mp3,audio/mpeg" class="form-control"><small class="hint">MP3，最大30MB；编辑时留空保留原音频，时长自动解析。</small></label><label>封面<input name="cover" type="file" accept="image/jpeg,image/png" class="form-control"><small class="hint">PNG/JPEG，最大5MB、2048像素。</small></label>
<label>授权类型<input name="license" maxlength="100" placeholder="如 CC0 / CC BY 4.0 / 单独授权" class="form-control"></label><label>来源<input name="source" maxlength="500" placeholder="原作品或授权来源" class="form-control"></label>
<label class="music-wide">署名文案<textarea name="attribution" maxlength="1200" rows="2" class="form-control"></textarea></label>
<label>排序<input name="sort_order" type="number" value="0" min="-9999" max="9999" class="form-control"><small class="hint">数字越小越靠前。</small></label><label class="d-flex align-items-center gap-2"><input name="published" type="checkbox" class="form-check-input">上架到客户端</label>
</div><p class="hint">上架表示已确认音频及录音授权允许 App 分发、试听和用户导出分享视频；需要署名的音乐请填写完整文案。</p><p id="musicSaveError" class="error" role="alert" hidden></p><div class="text-end"><button id="musicSave" class="btn btn-primary" data-admin-write="music">保存</button></div></form></dialog>
<script src="/admin/static/vendor/tabler.min.js"></script><script src="/admin/static/shell.js"></script><script src="/admin/static/ui.js"></script><script src="/admin/static/music.js"></script></body></html>
