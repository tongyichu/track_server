<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="referrer" content="no-referrer"><meta name="viewport" content="width=device-width,initial-scale=1"><title>时光轨迹 - 控制台</title><link rel="stylesheet" href="/admin/static/vendor/tabler.min.css"><link rel="stylesheet" href="/admin/static/style.css"><link rel="stylesheet" href="/admin/static/music.css"></head>
<body><header class="topbar"></header><main class="container wide"><div class="page-heading"><div><h1>背景音乐</h1><p>管理 3D 轨迹视频的配乐</p></div><div class="d-flex gap-2"><button id="musicRefresh" class="btn btn-outline-secondary">刷新</button><button id="musicAdd" class="btn btn-primary" data-admin-write="music">添加音乐</button></div></div><div class="music-toolbar"><span class="hint">拖动卡片调整顺序，跨区拖动即可上架或下架。</span><span id="musicStatus" class="hint" role="status" aria-live="polite"></span></div><p id="musicError" role="alert" class="error" hidden></p><div id="musicList" class="music-board"></div></main>
<dialog id="musicEditor" class="music-editor"><form id="musicForm" data-admin-fields="music"><div class="d-flex justify-content-between align-items-center"><h2 id="musicEditTitle">添加音乐</h2><button type="button" id="musicClose" class="btn btn-sm btn-outline-secondary">关闭</button></div><div class="music-fields">
<label>音乐名称<input name="name" required maxlength="80" class="form-control"></label><label>歌手 / 作者<input name="artist" required maxlength="80" class="form-control"></label>
<div class="music-wide music-audio-input">
<label>音频来源<select name="audio_mode" class="form-select"><option value="upload">上传文件</option><option value="link">使用链接</option></select></label>
<label id="musicFileField">音频文件<input name="audio" type="file" accept=".mp3,audio/mpeg" class="form-control"><small class="hint">MP3，最大30MB；编辑时留空保留原文件。</small></label>
<label id="musicLinkField" hidden>音频链接<input name="audio_link" type="url" maxlength="4096" placeholder="https://…/music.mp3" class="form-control"><small class="hint">填写公开可播放的MP3直链，保留原链接，不下载到服务端。</small></label>
<input name="duration_seconds" type="hidden">
<div id="musicPreviewBox" class="music-wide" hidden><div id="musicPreviewPlayer"></div><small id="musicPreviewState" class="hint" role="status">点击播放确认声音。</small></div>
</div><label class="music-wide">封面（选填）<input name="cover" type="file" accept="image/jpeg,image/png" class="form-control"><small class="hint">PNG/JPEG，最大5MB、2048像素。</small></label>
</div><p id="musicSaveError" class="error" role="alert" hidden></p><div class="text-end"><button id="musicSave" class="btn btn-primary" data-admin-write="music">保存</button></div></form></dialog>
<script src="/admin/static/vendor/tabler.min.js"></script><script src="/admin/static/shell.js"></script><script src="/admin/static/ui.js"></script><script src="/admin/static/music.js"></script></body></html>
