<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>时光轨迹 - 控制台</title>
  <link rel="stylesheet" href="/admin/static/admin-components.css" />
  <link rel="stylesheet" href="/admin/static/style.css" />
  <link rel="stylesheet" href="/admin/static/track_editor.css" />
  <link rel="stylesheet" href="/admin/static/admin_stats.css" />
</head>
<body>
  <header class="topbar">
    <div class="title">Track 管理后台</div>
    <nav class="nav">
      <a href="/admin/index.html">发布管理</a>
      <a href="/admin/users.html">用户管理</a>
      <a href="/admin/tracks.html">轨迹管理</a>
      <a class="active" href="/admin/route_groups.html">地图模式</a>
      <a href="/admin/track_submissions.html">投稿审核</a>
      <a href="/admin/companions.html">与友同行</a>
      <a href="/admin/feedbacks.html">意见反馈</a>
      <a href="/admin/analytics.html">埋点同步</a>
    </nav>
    <div class="spacer"></div>
    <div class="user">
      <span id="userName"></span>
      <button id="logoutBtn">退出</button>
    </div>
  </header>

  <main class="container wide route-groups-page">
    <div class="page-heading route-page-heading">
      <h1>地图模式</h1>
    </div>
    <details id="routeStatistics" class="panel feature-stats admin-stats-panel">
      <summary>路线覆盖与规模分布</summary>
      <div class="admin-stats-heading mt-2"><span id="mapStatisticsScope" class="hint">全量有效路线组</span><button id="refreshMapStatistics" type="button" class="btn btn-sm btn-outline-secondary">刷新统计</button></div>
      <p id="mapStatisticsError" class="error" role="alert" hidden></p>
      <div class="feature-stats-grid admin-chart-grid">
        <section>
          <div class="feature-chart-heading admin-stats-heading"><h3>路线空间覆盖</h3><button id="resetRouteMap" type="button" class="btn btn-sm btn-outline-secondary">全国视图</button></div>
          <div class="feature-chart-stage"><div id="routeSpatialChart" class="feature-chart" role="img" aria-label="按地区显示的路线空间覆盖"></div><p id="routeSpatialError" class="feature-chart-error" hidden></p></div>
          <p id="routeSpatialSummary" class="hint feature-chart-note" role="status"></p>
          <div id="routeMapSelection" class="feature-map-selection" hidden><label for="routeMapGroup" class="visually-hidden">选择地图位置</label><select id="routeMapGroup" class="form-select form-select-sm"></select><button id="openRouteMapGroup" type="button" class="btn btn-sm btn-outline-primary">定位或查看</button></div>
        </section>
        <section><div class="feature-chart-heading admin-stats-heading"><h3>路线组规模分布</h3><span class="hint">按组内轨迹数</span></div><div id="routeSizeChart" class="feature-chart" role="img" aria-label="路线组内轨迹数量分布"></div></section>
      </div>
    </details>
    <section class="panel route-groups-list-card">
      <div class="route-list-heading"><h2>路线组</h2><span id="listSummaryHint" role="status"></span></div>
      <div class="route-groups-toolbar">
        <div class="route-type-field">
          <span class="route-filter-label">运动类型</span>
          <div class="route-type-select" id="trackTypeSelect">
            <button type="button" class="form-select route-type-toggle" id="trackTypeToggle" aria-haspopup="listbox" aria-expanded="false"></button>
            <div class="route-type-menu" id="trackTypeMenu" role="listbox" hidden></div>
          </div>
        </div>
        <label>覆盖省份
          <select id="provinceCodeInput"><option value="">全部省份</option></select>
        </label>
        <label>覆盖城市
          <select id="cityCodeInput"><option value="">全部城市</option></select>
        </label>
        <button id="refreshBtn" class="btn btn-outline-secondary">刷新列表</button>
        <span class="hint route-query-status" id="statusHint" role="status" aria-live="polite"></span>
      </div>
      <div class="route-table-wrap">
        <table class="data route-group-table">
          <thead><tr><th scope="col">地区 / 路线</th><th scope="col">类型</th><th scope="col">成员</th></tr></thead>
          <tbody id="groupList"></tbody>
        </table>
      </div>
    </section>

  </main>

  <dialog class="modal route-management-modal" id="detailModal" aria-labelledby="detailName" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-xl">
      <div class="modal-content">
        <div class="modal-header route-modal-header">
          <div class="route-modal-heading">
            <h2 class="modal-title" id="detailName"></h2>
            <div class="route-detail-context">
              <p id="detailPath" class="route-detail-path" hidden></p>
              <span id="detailTrackType" class="route-detail-type"></span>
            </div>
            <span class="hint" id="detailHint" role="status" hidden></span>
            <button type="button" id="detailRetryBtn" class="btn btn-sm btn-outline-secondary" hidden>重试</button>
          </div>
          <button type="button" class="btn-close" data-admin-dismiss="dialog" aria-label="关闭"></button>
        </div>
        <div class="modal-body route-modal-body">
          <div class="route-workspace" id="detailPanel" hidden>
            <div class="route-detail-columns">
              <section class="route-detail-section" id="introSection" aria-labelledby="introHeading">
                <div class="route-panel-heading">
                  <h3 id="introHeading">路线介绍</h3><span id="introStatus" class="hint"></span>
                </div>
                <div id="introLoadState" class="route-form-state" hidden>
                  <span id="introLoadHint" role="status"></span>
                  <button type="button" id="introRetryBtn" class="btn btn-sm btn-outline-secondary" hidden>重试</button>
                </div>
                <div id="introEditor" hidden>
                  <div class="route-intro-primary">
                    <label>标题<input data-admin-input="route_groups" id="introZhName" type="text" /></label>
                    <label>摘要<textarea data-admin-input="route_groups" id="introZhSummary" rows="2"></textarea></label>
                  </div>
                  <p id="introWriteError" class="text-danger" role="alert" hidden></p>
                  <div class="route-intro-toolbar">
                    <button id="introAdvancedBtn" type="button" class="btn btn-sm btn-link" aria-haspopup="dialog">完整字段</button>
                    <a id="introPreviewLink" class="admin-link" target="_blank" rel="noopener" hidden>公开介绍</a>
                    <span class="route-intro-actions">
                      <button id="introGenerateBtn" data-admin-write="route_groups" class="btn btn-sm btn-outline-secondary">AI 草稿</button>
                      <button id="introSaveBtn" data-admin-write="route_groups" class="btn btn-sm btn-outline-secondary">保存草稿</button>
                      <button id="introPublishBtn" data-admin-write="route_groups" class="btn btn-sm btn-primary">发布</button>
                      <button id="introUnpublishBtn" data-admin-write="route_groups" class="btn btn-sm btn-outline-danger">下线</button>
                    </span>
                  </div>
                </div>
              </section>

              <section class="route-detail-section" aria-labelledby="maintenanceHeading">
                <div class="route-panel-heading">
                  <h3 id="maintenanceHeading">路线组管理</h3><code id="detailGroupID"></code>
                </div>
                <div class="route-maintenance-fields" data-admin-write="route_groups">
                  <div class="route-inline-form">
                    <label for="renameInput">组名</label>
                    <input data-admin-input="route_groups" id="renameInput" type="text" />
                    <button id="renameBtn" type="button" class="btn btn-sm btn-outline-secondary">改名</button>
                  </div>
                  <div class="route-inline-form">
                    <label for="mergeInput">源组</label>
                    <input data-admin-input="route_groups" id="mergeInput" type="text" placeholder="输入要并入的路线组编号" />
                    <button id="mergeBtn" type="button" class="btn btn-sm btn-outline-secondary">合并</button>
                  </div>
                </div>
                <a id="detailAreaLink" class="admin-link route-area-link" target="_blank" rel="noopener" hidden>区域介绍</a>
              </section>
            </div>

            <section class="route-detail-section route-members" aria-labelledby="memberHeading">
              <div class="route-panel-heading">
                <h3 id="memberHeading">成员轨迹</h3><span class="hint" id="detailMemberCount"></span>
              </div>
              <ul class="route-member-list" id="memberList"></ul>
              <nav class="route-member-pagination" id="memberPager" aria-label="成员轨迹分页" hidden>
                <button type="button" class="btn btn-sm btn-outline-secondary" id="memberPrevBtn">上一页</button>
                <span id="memberPageHint" class="hint" role="status"></span>
                <button type="button" class="btn btn-sm btn-outline-secondary" id="memberNextBtn">下一页</button>
              </nav>
            </section>
          </div>
        </div>
      </div>
    </div>
  </dialog>

  <dialog class="modal route-intro-modal" id="introFieldsModal" aria-labelledby="introFieldsTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="introFieldsTitle" class="modal-title">路线介绍字段</h2>
          <button type="button" class="btn-close" data-admin-dismiss="dialog" aria-label="关闭"></button>
        </div>
        <div class="modal-body">
          <section class="route-intro-section">
            <h3>出行信息</h3>
            <div class="route-intro-grid">
              <label>难度<input data-admin-input="route_groups" id="introDifficulty" type="text" placeholder="easy / moderate / hard" /></label>
              <label>适宜季节（逗号分隔）<input data-admin-input="route_groups" id="introBestSeasons" type="text" placeholder="autumn,winter" /></label>
              <label>预计最短时长（分钟）<input data-admin-input="route_groups" id="introDurationMin" type="number" min="0" /></label>
              <label>预计最长时长（分钟）<input data-admin-input="route_groups" id="introDurationMax" type="number" min="0" /></label>
            </div>
          </section>
          <div class="route-intro-language-grid">
            <section class="route-language-card">
              <h3>中文补充</h3>
              <label>正文（每行一段）<textarea data-admin-input="route_groups" id="introZhDescription" rows="4"></textarea></label>
              <label>亮点（每行一项）<textarea data-admin-input="route_groups" id="introZhHighlights" rows="3"></textarea></label>
              <label>提示（每行一项）<textarea data-admin-input="route_groups" id="introZhTips" rows="3"></textarea></label>
            </section>
            <section class="route-language-card">
              <h3>英文介绍</h3>
              <label>英文标题<input data-admin-input="route_groups" id="introEnName" type="text" /></label>
              <label>英文摘要<textarea data-admin-input="route_groups" id="introEnSummary" rows="2"></textarea></label>
              <label>英文正文（每行一段）<textarea data-admin-input="route_groups" id="introEnDescription" rows="3"></textarea></label>
              <label>英文亮点（每行一项）<textarea data-admin-input="route_groups" id="introEnHighlights" rows="2"></textarea></label>
              <label>英文提示（每行一项）<textarea data-admin-input="route_groups" id="introEnTips" rows="2"></textarea></label>
            </section>
          </div>
        </div>
      </div>
    </div>
  </dialog>

  <dialog class="modal route-management-modal" id="scenicMembersModal" aria-labelledby="scenicMembersName" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header route-modal-header">
          <div class="route-modal-heading">
            <h2 class="modal-title" id="scenicMembersName"></h2>
            <div class="route-scenic-meta">
              <p class="route-detail-path" id="scenicMembersPath"></p>
              <a id="scenicMembersInfo" target="_blank" rel="noopener" data-admin-read="scenic_spots" aria-label="查看景点信息（在新标签页打开）" hidden>查看景点信息</a>
            </div>
          </div>
          <button type="button" class="btn-close" data-admin-dismiss="dialog" aria-label="关闭"></button>
        </div>
        <div class="modal-body route-modal-body">
          <section class="route-workspace" aria-labelledby="scenicTracksHeading">
            <div class="route-panel-heading"><h3 id="scenicTracksHeading">景点轨迹</h3><span id="scenicTracksCount" class="hint"></span></div>
            <ul id="scenicTracksList" class="route-member-list"></ul>
            <div class="route-form-state" id="scenicTracksState" hidden><span id="scenicTracksHint" role="status"></span><button type="button" class="btn btn-sm btn-outline-secondary" id="scenicTracksRetry" hidden>重试</button></div>
            <nav class="route-member-pagination" id="scenicTracksPager" aria-label="景点轨迹分页" hidden>
              <button type="button" class="btn btn-sm btn-outline-secondary" id="scenicTracksPrev">上一页</button><span class="hint" id="scenicTracksPage" role="status"></span><button type="button" class="btn btn-sm btn-outline-secondary" id="scenicTracksNext">下一页</button>
            </nav>
          </section>
        </div>
      </div>
    </div>
  </dialog>

  <script src="/admin/static/admin-components.js"></script>
  <script src="/admin/static/shell.js"></script>
  <script src="/admin/static/admin_stats.js"></script>
  <script src="/admin/static/ui.js"></script>

  <script src="/admin/static/admin_usage_charts.js"></script>
<script src="/admin/static/region_picker.js"></script>
  <script src="/admin/static/place_candidates.js"></script>
  <script src="/admin/static/track_map_preview.js"></script>
  <script src="/admin/static/track_editor.js"></script>
  <script src="/admin/static/route_groups.js"></script>
  <script src="/admin/static/feature_statistics.js"></script>
</body>
</html>
