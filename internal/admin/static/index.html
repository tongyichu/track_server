<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>发布管理 - Track</title>
  <link rel="stylesheet" href="/admin/static/vendor/tabler.min.css" />
  <link rel="stylesheet" href="/admin/static/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="title">Track 管理后台</div>
    <nav class="nav">
      <a class="active" href="/admin/index.html">发布管理</a>
      <a href="/admin/users.html">用户管理</a>
      <a href="/admin/tracks.html">轨迹管理</a>
      <a href="/admin/track_submissions.html">投稿审核</a>
      <a href="/admin/route_groups.html">地图模式</a>
      <a href="/admin/companions.html">与友同行</a>
      <a href="/admin/feedbacks.html">意见反馈</a>
      <a href="/admin/analytics.html">埋点同步</a>
    </nav>
    <div class="spacer"></div>
    <div class="user">
      <span id="userName"></span>
      <button id="logoutBtn">退出</button>
    </div>
  </header>

  <main class="container">
    <section class="panel admin-client-stats" id="clientStats" aria-busy="true">
      <div class="admin-section-heading">
        <h2>客户端统计</h2>
        <div class="row">
          <select id="clientStatsDays">
            <option value="7">近 7 天</option>
            <option value="30" selected>近 30 天</option>
          </select>
          <button id="refreshClientStats" type="button" class="btn btn-sm btn-outline-secondary">刷新数据</button>
        </div>
      </div>
      <p class="hint">口径：周期内活跃的去重设备，来自客户端升级检查与登录上报；趋势按自然日统计当天出现过的设备。</p>
      <p id="clientStatsError" class="error" role="alert" hidden></p>
      <div class="metric-grid">
        <div class="metric-card"><span>活跃设备</span><strong id="csActiveDevices">—</strong><small id="csActiveNote">周期内去重设备</small></div>
        <div class="metric-card"><span>最新版本活跃</span><strong id="csLatestDevices">—</strong><small id="csLatestNote">暂无已发布版本</small></div>
        <div class="metric-card"><span>低于强升线设备</span><strong id="csBelowMin">—</strong><small id="csBelowMinNote">暂无强升线</small></div>
      </div>
      <div class="feature-stats-grid">
        <article class="admin-stat-panel"><h3>版本活跃趋势</h3><div id="csTrendChart" class="chart-medium" role="img" aria-label="版本活跃趋势堆叠面积图"></div></article>
        <article class="admin-stat-panel"><h3>版本分布</h3><div id="csVersionChart" class="chart-small" role="img" aria-label="版本分布饼图"></div></article>
        <article class="admin-stat-panel"><h3>机型分布 Top 10</h3><div id="csModelChart" class="chart-small" role="img" aria-label="机型分布条形图"></div></article>
        <article class="admin-stat-panel"><h3>系统版本分布</h3><div id="csOsChart" class="chart-small" role="img" aria-label="系统版本分布条形图"></div></article>
      </div>
    </section>

    <section class="panel" data-admin-write="releases">
      <h2>发布新版本</h2>
      <form id="publishForm" data-admin-write="releases" class="grid">
        <input type="hidden" name="platform" value="android" />
        <input type="hidden" name="version_name" />
        <input type="hidden" name="version_code" />
        <input type="hidden" name="package_url" />
        <input type="hidden" name="package_size" value="0" />
        <input type="hidden" name="package_md5" />

        <div class="full row release-form-row">
          <label>最低支持版本号
            <input type="number" name="min_supported_version_code" min="0" value="0" />
          </label>
          <label>发布状态
            <select name="status">
              <option value="published">published</option>
              <option value="draft">draft</option>
              <option value="archived">archived</option>
            </select>
          </label>
          <label class="release-file-label">选择安装包
            <input type="file" id="apkFile" accept=".apk" required />
          </label>
          <button type="button" id="uploadBtn">上传到服务器</button>
          <span class="hint" id="uploadHint"></span>
        </div>
        <div class="full hint" id="packageMetadataHint"></div>

        <div class="full">
          <span class="form-label">版本说明 (release_notes)</span>
          <div id="releaseNotesList" class="release-notes-editor"></div>
        </div>

        <div class="full actions">
          <button type="submit">发布</button>
          <label class="form-switch release-force-switch">
            <input class="form-check-input" type="checkbox" name="force_update" />
            <span>强制升级</span>
          </label>
          <span class="error" id="publishErr"></span>
          <span class="ok" id="publishOk"></span>
        </div>
      </form>
    </section>

    <section class="panel">
      <div class="admin-section-heading">
        <h2>版本列表</h2>
        <a href="javascript:void(0)" class="admin-link" id="openChangelogs">更新日志</a>
      </div>
      <div class="row">
        <label>状态过滤
          <select id="filterStatus">
            <option value="">全部</option>
            <option value="published">published</option>
            <option value="draft">draft</option>
            <option value="archived">archived</option>
          </select>
        </label>
        <button id="refreshBtn">刷新</button>
      </div>
      <table class="data">
        <thead>
          <tr>
            <th>ID</th><th>版本名</th>
            <th>最低支持</th><th>强升</th><th>状态</th>
            <th>发布人</th><th>时间</th><th>包大小</th><th>更新说明</th><th>操作</th>
          </tr>
        </thead>
        <tbody id="releaseList"></tbody>
      </table>
    </section>
  </main>

  <script src="/admin/static/vendor/tabler.min.js"></script>
  <script src="/admin/static/shell.js"></script>
  <script src="/admin/static/ui.js"></script>
  <script src="/admin/static/app.js"></script>
</body>
</html>
