<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>用户管理 - Track</title>
  <link rel="stylesheet" href="/admin/static/vendor/tabler.min.css" />
  <link rel="stylesheet" href="/admin/static/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="title">Track 管理后台</div>
    <nav class="nav">
      <a href="/admin/index.html">App 发布</a>
      <a class="active" href="/admin/users.html">用户管理</a>
      <a href="/admin/tracks.html">轨迹管理</a>
      <a href="/admin/route_groups.html">聚合路线</a>
      <a href="/admin/companions.html">同行管理</a>
      <a href="/admin/feedbacks.html">意见反馈</a>
      <a href="/admin/analytics.html">埋点同步</a>
    </nav>
    <div class="spacer"></div>
    <div class="user">
      <span id="userName"></span>
      <button id="logoutBtn">退出</button>
    </div>
  </header>

  <main class="container wide">
    <section class="panel">
      <div class="admin-section-heading"><h2>用户画像分布</h2><span class="hint">城市按已完成轨迹统计，同一用户可能出现在多个城市</span></div>
      <div class="admin-user-distribution-grid">
        <article class="admin-stat-panel admin-user-chart-card"><div><h3>性别分布</h3><small>包含全部用户</small></div><div class="admin-user-chart-layout"><div id="userGenderChart" class="admin-user-pie"></div><div id="userGenderStats" class="admin-user-legend"></div></div></article>
        <article class="admin-stat-panel admin-user-chart-card admin-user-zodiac-card"><div><h3>星座分布</h3><small>按生日推算，包含未知</small></div><div class="admin-user-chart-layout admin-user-zodiac-layout"><div id="userZodiacChart" class="admin-user-pie"></div><div id="userZodiacStats" class="admin-user-legend admin-zodiac-legend"></div></div></article>
        <article class="admin-stat-panel admin-user-chart-card admin-user-city-card"><div><h3>轨迹用户省份分布</h3><small>点击省份查看该省城市用户数 Top 10</small></div><div class="admin-user-city-layout"><div><div id="userProvinceMap" class="admin-user-china-map" role="img" aria-label="中国各省轨迹用户分布矢量地图"></div><div class="admin-user-map-legend"><span>较少</span><i></i><span>较多</span></div></div><aside class="admin-user-city-aside"><div class="admin-user-foreign-stat"><span>海外城市用户数</span><strong id="userForeignCityTotal">—</strong><small id="userForeignCityNote">按城市去重统计，跨城市用户可能重复</small></div><div class="admin-user-foreign-stat admin-user-unknown-stat"><span>未知城市</span><strong id="userUnknownCityTotal">—</strong></div><h4 id="userCityStatsTitle">城市用户数 Top 10</h4><div id="userCityStats" class="admin-distribution-list admin-city-list"></div></aside></div></article>
      </div>
    </section>
    <section class="panel">
      <h2>用户列表 <span class="hint" id="totalHint"></span></h2>
      <div class="row">
        <label>昵称搜索 <input id="titleFilter" type="search" placeholder="输入用户名称关键词" /></label>
        <button id="searchBtn">搜索</button>
        <button id="refreshBtn">刷新</button>
        <button id="prevBtn" disabled>上一页</button>
        <button id="nextBtn" disabled>下一页</button>
        <span class="hint" id="pageHint"></span>
      </div>
      <table class="data">
        <thead>
          <tr>
            <th>头像</th><th>昵称</th><th>手机号</th><th>账号限制</th>
            <th>上次登录</th><th>创建时间</th><th>操作</th>
          </tr>
        </thead>
        <tbody id="userList"></tbody>
      </table>
    </section>
  </main>

  <script src="/admin/static/vendor/tabler.min.js"></script>
  <script src="/admin/static/shell.js"></script>
  <script src="/admin/static/ui.js"></script>
  <script src="/admin/static/vendor/echarts.min.js"></script>
  <script src="/admin/static/users.js"></script>
</body>
</html>
