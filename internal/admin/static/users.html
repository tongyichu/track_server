<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>用户管理 - Track</title>
  <link rel="stylesheet" href="/admin/static/vendor/tabler.min.css" />
  <link rel="stylesheet" href="/admin/static/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="title">Track 管理后台</div>
    <nav class="nav">
      <a href="/admin/index.html">App 发布</a>
      <a class="active" href="/admin/users.html">用户管理</a>
      <a href="/admin/tracks.html">轨迹管理</a>
      <a href="/admin/route_groups.html">聚合路线</a>
      <a href="/admin/companions.html">同行管理</a>
      <a href="/admin/feedbacks.html">意见反馈</a>
      <a href="/admin/analytics.html">埋点同步</a>
    </nav>
    <div class="spacer"></div>
    <div class="user">
      <span id="userName"></span>
      <button id="logoutBtn">退出</button>
    </div>
  </header>

  <main class="container">
    <section class="panel">
      <div class="admin-section-heading"><h2>用户概况</h2><span class="hint">资料分布按当前用户档案统计</span></div>
      <div class="admin-user-summary-grid">
        <article class="admin-stat-panel admin-user-total"><span>全部用户</span><strong id="userStatsTotal">—</strong><small>当前注册用户</small></article>
        <article class="admin-stat-panel admin-user-gender"><span>男性</span><strong id="userGenderMale">—</strong><small>性别资料为男性</small></article>
        <article class="admin-stat-panel admin-user-gender"><span>女性</span><strong id="userGenderFemale">—</strong><small>性别资料为女性</small></article>
        <article class="admin-stat-panel admin-user-gender"><span>未填写性别</span><strong id="userGenderUnknown">—</strong><small>未填写或资料未知</small></article>
      </div>
      <div class="admin-section-heading admin-user-distribution-heading"><h2>用户画像分布</h2><span class="hint">城市按已完成轨迹统计，同一用户可能出现在多个城市</span></div>
      <div class="admin-user-distribution-grid">
        <article class="admin-stat-panel"><h3>星座</h3><div id="userZodiacStats" class="admin-distribution-list admin-zodiac-list"></div></article>
        <article class="admin-stat-panel"><h3>轨迹用户城市 Top 10</h3><div id="userCityStats" class="admin-distribution-list admin-city-list"></div></article>
      </div>
    </section>
    <section class="panel">
      <h2>用户列表 <span class="hint" id="totalHint"></span></h2>
      <div class="row">
        <label>昵称搜索 <input id="titleFilter" type="search" placeholder="输入用户名称关键词" /></label>
        <button id="searchBtn">搜索</button>
        <button id="refreshBtn">刷新</button>
        <button id="prevBtn" disabled>上一页</button>
        <button id="nextBtn" disabled>下一页</button>
        <span class="hint" id="pageHint"></span>
      </div>
      <table class="data">
        <thead>
          <tr>
            <th>ID</th><th>头像</th><th>昵称</th><th>手机号</th>
            <th>客户端语言</th><th>个性签名</th>
            <th>账号限制</th><th>创建时间</th><th>更新时间</th><th>操作</th>
          </tr>
        </thead>
        <tbody id="userList"></tbody>
      </table>
    </section>
  </main>

  <script src="/admin/static/vendor/tabler.min.js"></script>
  <script src="/admin/static/shell.js"></script>
  <script src="/admin/static/ui.js"></script>
  <script src="/admin/static/users.js"></script>
</body>
</html>
