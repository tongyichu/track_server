<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>用户管理 - Track</title>
  <link rel="stylesheet" href="/admin/static/vendor/tabler.min.css" />
  <link rel="stylesheet" href="/admin/static/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="title">Track 管理后台</div>
    <nav class="nav">
      <a href="/admin/index.html">App 发布</a>
      <a class="active" href="/admin/users.html">用户管理</a>
      <a href="/admin/tracks.html">轨迹管理</a>
      <a href="/admin/route_groups.html">聚合路线</a>
      <a href="/admin/companions.html">同行管理</a>
      <a href="/admin/feedbacks.html">意见反馈</a>
      <a href="/admin/analytics.html">埋点同步</a>
    </nav>
    <div class="spacer"></div>
    <div class="user">
      <span id="userName"></span>
      <button id="logoutBtn">退出</button>
    </div>
  </header>

  <main class="container wide">
    <section class="panel">
      <div class="admin-section-heading"><h2>用户画像分布</h2></div>
      <div class="admin-user-distribution-grid">
        <div class="admin-user-profile-charts">
          <article class="admin-stat-panel admin-user-chart-card"><div><h3>性别分布</h3></div><div class="admin-user-chart-layout"><div id="userGenderChart" class="admin-user-pie"></div><div id="userGenderStats" class="admin-user-legend"></div></div></article>
          <article class="admin-stat-panel admin-user-chart-card admin-user-zodiac-card"><div><h3>星座分布</h3></div><div class="admin-user-chart-layout admin-user-zodiac-layout"><div id="userZodiacChart" class="admin-user-pie"></div><div id="userZodiacStats" class="admin-user-legend admin-zodiac-legend"></div></div></article>
        </div>
        <article class="admin-stat-panel admin-user-chart-card admin-user-city-card"><div><h3>用户所在省份分布</h3></div><div class="admin-user-city-layout"><div class="admin-user-map-stage"><div id="userProvinceMap" class="admin-user-china-map" role="img" aria-label="中国各省份用户所在城市分布矢量地图"></div></div><aside class="admin-user-city-aside"><div class="admin-user-foreign-stat"><span>海外城市用户数</span><strong id="userForeignCityTotal">—</strong><small id="userForeignCityNote">每个用户只计入当前所在城市</small></div><div class="admin-user-foreign-stat admin-user-unknown-stat"><span>未知城市</span><strong id="userUnknownCityTotal">—</strong></div><h4 id="userCityStatsTitle">城市用户数 Top 10</h4><div id="userCityStats" class="admin-distribution-list admin-city-list"></div></aside></div></article>
      </div>
    </section>
    <section class="panel">
      <h2>用户列表 <span class="hint" id="totalHint"></span></h2>
      <div class="row admin-toolbar user-toolbar">
        <label>昵称搜索 <input id="titleFilter" class="form-control" type="search" placeholder="输入用户名称关键词" /></label>
        <label>内部人员 <select id="internalFilter" class="form-select"><option value="">全部</option><option value="true">是</option><option value="false">否</option></select></label>
        <label>所在城市 <select id="cityFilter" class="form-select"><option value="">全部城市</option></select></label>
        <label>性别 <select id="genderFilter" class="form-select"><option value="">全部</option><option value="male">男</option><option value="female">女</option><option value="unknown">未设置</option></select></label>
        <label>星座 <select id="zodiacFilter" class="form-select"><option value="">全部</option><option value="aries">白羊座</option><option value="taurus">金牛座</option><option value="gemini">双子座</option><option value="cancer">巨蟹座</option><option value="leo">狮子座</option><option value="virgo">处女座</option><option value="libra">天秤座</option><option value="scorpio">天蝎座</option><option value="sagittarius">射手座</option><option value="capricorn">摩羯座</option><option value="aquarius">水瓶座</option><option value="pisces">双鱼座</option></select></label>
        <label>账号限制 <select id="restrictedFilter" class="form-select"><option value="">全部</option><option value="true">已限制</option><option value="false">正常</option></select></label>
        <button id="searchBtn" class="btn btn-primary">搜索</button>
        <button id="refreshBtn" class="btn btn-outline-secondary">刷新</button>
        <button id="prevBtn" class="btn btn-outline-secondary" disabled>上一页</button>
        <button id="nextBtn" class="btn btn-outline-secondary" disabled>下一页</button>
        <span class="hint" id="pageHint"></span>
      </div>
      <table class="data admin-user-table">
        <thead>
          <tr>
            <th>用户</th><th>手机号</th><th>性别</th><th>星座</th><th>所在城市</th>
            <th>账号限制</th><th>上次登录</th><th>操作</th>
          </tr>
        </thead>
        <tbody id="userList"></tbody>
      </table>
    </section>
  </main>

  <div class="modal modal-blur fade" id="userDetailModal" tabindex="-1" aria-hidden="true" aria-labelledby="userDetailTitle">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-lg" role="document">
      <form class="modal-content" id="userDetailForm">
        <div class="modal-header">
          <h2 class="modal-title" id="userDetailTitle">用户资料</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
        </div>
        <div class="modal-body">
          <div class="admin-user-detail-head">
            <img id="userDetailAvatar" class="admin-user-detail-avatar" data-no-preview alt="用户头像" />
            <div><h3 id="userDetailName">加载中…</h3><div class="hint" id="userDetailMeta"></div></div>
          </div>
          <div class="admin-dialog-form admin-user-detail-grid">
            <label class="form-label">昵称<input class="form-control" name="nickname" maxlength="20" required /></label>
            <label class="form-label">手机号<input class="form-control" name="phone" maxlength="32" /></label>
            <label class="form-label">性别<select class="form-select" name="gender"><option value="">未设置</option><option value="male">男</option><option value="female">女</option></select></label>
            <label class="form-label">生日<input class="form-control" name="birthday" type="date" min="1900-01-01" /></label>
            <label class="form-label full">所在城市<input class="form-control" id="userDetailLocation" readonly /></label>
            <label class="form-label full">个人签名<textarea class="form-control" name="signature" maxlength="100" rows="3"></textarea></label>
            <label class="form-switch admin-user-detail-internal full"><input class="form-check-input" type="checkbox" name="is_internal"><span>内部人员</span></label>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">取消</button>
          <button type="submit" class="btn btn-primary" id="userDetailSave">保存</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/admin/static/vendor/tabler.min.js"></script>
  <script src="/admin/static/shell.js"></script>
  <script src="/admin/static/ui.js"></script>
  <script src="/admin/static/vendor/echarts.min.js"></script>
  <script src="/admin/static/users.js"></script>
</body>
</html>
