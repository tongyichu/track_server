<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>城市管理 - Track</title>
  <link rel="stylesheet" href="/admin/static/vendor/tabler.min.css" />
  <link rel="stylesheet" href="/admin/static/style.css" />
  <link rel="stylesheet" href="/admin/static/regions.css" />
</head>
<body>
  <header class="topbar"></header>
  <main class="container">
    <section class="region-heading">
      <div><h1>城市管理</h1><p class="text-secondary">这里是客户端城市目录的唯一数据源。国内编码保持稳定，国外可按国家、州和城市等层级组织。</p></div>
    </section>
    <p id="regionStatus" class="text-secondary" role="status"></p>
    <div class="region-country-bar"><div id="regionCountryTabs" class="region-country-tabs" role="tablist" aria-label="国家"></div><button id="regionAddCountry" type="button" data-admin-write="regions" class="region-country-add" aria-label="新增国家" title="新增国家">+</button></div>
    <div class="region-layout">
      <section class="card region-tree-panel">
        <div class="card-body">
          <div class="region-tree-actions"><input id="regionSearch" class="form-control" placeholder="搜索当前国家内的地区" aria-label="搜索当前国家内的地区" /><button id="regionAddChild" data-admin-write="regions" class="btn btn-outline-primary" disabled>新增下级</button></div>
          <div id="regionTree" class="region-tree" role="tree"></div>
        </div>
      </section>
      <section class="card region-editor-panel">
        <div class="card-body">
          <p id="regionEmpty" class="text-secondary">选择左侧地区后编辑。新增节点先保留在本页，点击该节点的“保存”后生效。</p>
          <form id="regionForm" data-admin-fields="regions" hidden>
            <div class="region-editor-title"><div class="region-editor-identity"><h2 id="regionEditorTitle">地区资料</h2><span id="regionId" class="region-editor-id"></span></div><div class="region-editor-actions"><div class="region-ai-action"><button id="regionResearch" type="button" data-admin-write="regions" class="btn btn-outline-primary">AI 联网填写</button><span id="regionResearchStatus" class="region-research-status" role="status" hidden><span id="regionResearchStatusText"></span><span id="regionResearchDots" class="region-loading-dots" aria-hidden="true" hidden><span>.</span><span>.</span><span>.</span></span></span></div><button id="regionDeleteDraft" type="button" data-admin-write="regions" class="btn btn-outline-danger" hidden>删除未保存节点</button><button id="regionSaveNode" type="button" data-admin-write="regions" class="btn btn-primary">保存当前节点</button></div></div>
            <section id="regionResearchPanel" class="region-research-panel" hidden aria-label="AI 联网查询结果"><h3>联网资料草稿</h3><p class="form-hint">请核对文字来源；点击代入后仍需保存当前节点。</p><div id="regionDraftFields"></div><div class="region-research-actions"><button id="regionApplyEmpty" type="button" data-admin-write="regions" class="btn btn-outline-primary">仅填写空白字段</button><button id="regionApplyAll" type="button" data-admin-write="regions" class="btn btn-outline-secondary">代入全部文字</button></div><div id="regionResearchSources"></div></section>
            <div class="region-form-grid">
              <label>名称<input id="regionName" class="form-control" maxlength="64" required /></label>
              <label>英文名称<input id="regionNameEn" class="form-control" maxlength="200" /></label>
              <label>高德 adcode<input id="regionAmapAdcode" class="form-control" inputmode="numeric" maxlength="6" placeholder="六位行政区编码" /></label>
              <label>Google 地区 Place ID<input id="regionGooglePlaceId" class="form-control" maxlength="2048" placeholder="地区的 Place ID，非景点 ID" /></label>
              <label><span id="regionCountryCodeLabel">所属国家代码</span><input id="regionCountryCode" class="form-control" maxlength="2" placeholder="如 CN、US" /></label>
              <label id="regionContinentField">所属洲<select id="regionContinent" class="form-select"><option value="">未设置</option><option value="AS">亚洲</option><option value="EU">欧洲</option><option value="AF">非洲</option><option value="NA">北美洲</option><option value="SA">南美洲</option><option value="OC">大洋洲</option><option value="AN">南极洲</option></select></label>
              <label>纬度<input id="regionLatitude" class="form-control" type="number" step="any" min="-90" max="90" /></label>
              <label>经度<input id="regionLongitude" class="form-control" type="number" step="any" min="-180" max="180" /></label>
              <label class="region-full">城市宣传口号<input id="regionSlogan" class="form-control" maxlength="500" /><span class="form-hint">优先填写流行、经典且有当地辨识度的旅游或城市形象宣传语；请核对来源。</span></label>
              <label class="region-full">简介<textarea id="regionDescription" class="form-control" rows="5" maxlength="8000"></textarea></label>
              <label class="form-check region-selectable"><input id="regionSelectable" class="form-check-input" type="checkbox" /><span class="form-check-label">可在客户端选为城市</span></label>
            </div>
            <section id="regionPhotos" class="region-photos" hidden></section>
          </form>
        </div>
      </section>
    </div>
  </main>
  <script src="/admin/static/vendor/tabler.min.js"></script>
  <script src="/admin/static/shell.js"></script>
  <script src="/admin/static/ui.js"></script>
  <script src="/admin/static/region_photos.js"></script>
  <script src="/admin/static/regions.js"></script>
</body>
</html>
