upstream hertz_track_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name track.example.com;  # TODO: replace with your real domain

    # If HTTPS is enabled, you can optionally redirect all HTTP traffic to HTTPS
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://hertz_track_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Basic security headers
        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-XSS-Protection "1; mode=block";
        add_header Referrer-Policy "no-referrer-when-downgrade";
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline'" always;
    }

    # Optional application health check endpoint (if implemented)
    location /healthz {
        proxy_pass http://hertz_track_backend/healthz;
    }
}

