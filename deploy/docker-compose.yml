version: "3.9"

services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: hertz-track:latest
    container_name: hertz-track-api
    env_file:
      - .env
    environment:
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/trackapp}
      - MYSQL_DSN=${MYSQL_DSN:-}
      - SERVER_ADDR=${BIND_ADDR:-:8080}
      - LOG_DIR=${LOG_DIR:-/var/log/track_server}
      - TLS_CERT_FILE=${TLS_CERT_FILE:-}
      - TLS_KEY_FILE=${TLS_KEY_FILE:-}
    depends_on:
      - mongo
    ports:
      - "${APP_PORT:-8080}:8080"
      # - "${APP_TLS_PORT:-8443}:8443"  # uncomment when TLS is enabled
    volumes:
      - /var/log/track_server:/var/log/track_server
      # - ./certs:/app/certs:ro  # uncomment when TLS is enabled
    restart: unless-stopped
    networks:
      - backend

  mongo:
    image: mongo:7.0
    container_name: hertz-track-mongo
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=trackapp
    restart: unless-stopped
    networks:
      - backend

volumes:
  mongo_data:
    name: hertz-track-mongo-data

networks:
  backend:
    driver: bridge
