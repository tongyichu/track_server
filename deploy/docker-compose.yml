services:
  api:
    image: crpi-p78v4agazv8zn80d.cn-beijing.personal.cr.aliyuncs.com/track_server/track_server_go:latest
    container_name: hertz-track-api
    environment:
#      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/trackapp}
#      - MONGO_DB_NAME=${MONGO_DB_NAME:-trackapp}
      - MYSQL_DSN=root:track_server_6509HbK@tcp(172.18.0.1:3306)/track_db?charset=utf8mb4&parseTime=True
      # Backward compatible with older env files that used BIND_ADDR
      - SERVER_ADDR=${SERVER_ADDR:-${BIND_ADDR:-:8080}}
      - TZ=${TZ:-Asia/Shanghai}
      - LOG_DIR=${LOG_DIR:-/var/log/track_server}
      - JWT_SECRET=${JWT_SECRET:-track_server_default_jwt_secret}
      - TLS_CERT_FILE=${TLS_CERT_FILE:-}
      - TLS_KEY_FILE=${TLS_KEY_FILE:-}
      - USE_IN_MEMORY_STORE=${USE_IN_MEMORY_STORE:-}
      - SCHEDULER_ENABLED=${SCHEDULER_ENABLED:-false}
      - RECOMMENDATION_ENABLED=${RECOMMENDATION_ENABLED:-false}
      - RECOMMENDATION_TIMEOUT_MILLIS=${RECOMMENDATION_TIMEOUT_MILLIS:-250}
      - RECOMMENDATION_FEED_TTL_MINUTES=${RECOMMENDATION_FEED_TTL_MINUTES:-60}
      - RECOMMENDATION_DATA_MAX_AGE_HOURS=${RECOMMENDATION_DATA_MAX_AGE_HOURS:-48}
      - RECOMMENDATION_CANDIDATE_LIMIT=${RECOMMENDATION_CANDIDATE_LIMIT:-300}
      - RECOMMENDATION_FEED_SIZE=${RECOMMENDATION_FEED_SIZE:-200}
      - RECOMMENDATION_PROFILE_CRON=${RECOMMENDATION_PROFILE_CRON:-0 5 * * *}
      - RECOMMENDATION_ITEM_STATS_CRON=${RECOMMENDATION_ITEM_STATS_CRON:-30 5 * * *}
      - RECOMMENDATION_SESSION_CLEAN_CRON=${RECOMMENDATION_SESSION_CLEAN_CRON:-@every 20m}
      - WECHAT_APP_ID=${WECHAT_APP_ID:-}
      - WECHAT_APP_SECRET=${WECHAT_APP_SECRET:-}
      - AMAP_WEB_KEY=${AMAP_WEB_KEY:-${AMAP_KEY:-}}
      - AMAP_REST_KEY=${AMAP_REST_KEY:-}
    depends_on:
      - mongo
    ports:
      - "${APP_PORT:-8080}:8080"
      # - "${APP_TLS_PORT:-8443}:8443"  # uncomment when TLS is enabled
    volumes:
      - /var/log/track_server:/var/log/track_server
      # - ./certs:/app/certs:ro  # uncomment when TLS is enabled
    restart: unless-stopped
    networks:
      - backend

  mongo:
    image: mongo:7.0
    container_name: hertz-track-mongo
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=trackapp
    restart: unless-stopped
    networks:
      - backend

volumes:
  mongo_data:
    name: hertz-track-mongo-data

networks:
  backend:
    driver: bridge
